# iOS J2 Port - XNU 4570 ARMv7 Build
#
# Builds XNU 4570.71.2 (iOS 10.3) for Exynos 3475 (SM-J200M / j2lte)
# on macOS runner using Apple's iPhoneOS SDK.
#
# Clones XNU 4570.71.2 from apple-oss-distributions, applies J2 patches,
# builds kernel with MACHINE_CONFIG=J2 (ARMv7, 4KB pages, Cortex-A7).

name: "iOS J2 Port - XNU 4570 ARMv7 Build"

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build (remove cache)'
        type: boolean
        default: true

jobs:
  xnu-armv7-build:
    name: Build XNU 4570 ARMv7 J2
    runs-on: macos-14
    timeout-minutes: 120
    
    steps:
      - name: Checkout j2lte-build (experiment/ios-port branch)
        uses: actions/checkout@v4
        with:
          ref: experiment/ios-port
          fetch-depth: 0
      
      - name: Checkout XNU 4570.71.2 source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: xnu-4570.71.2
          path: ios-port/xnu-4570.71.2-source
      
      - name: Apply J2 patches to XNU
        run: |
          cp ios-port/xnu-4570.71.2/pexpert/pexpert/arm/J2.h ios-port/xnu-4570.71.2-source/pexpert/pexpert/arm/
          cp ios-port/xnu-4570.71.2/pexpert/pexpert/arm/board_config.h ios-port/xnu-4570.71.2-source/pexpert/pexpert/arm/
          cp ios-port/xnu-4570.71.2/config/MASTER.arm ios-port/xnu-4570.71.2-source/config/
          cp ios-port/xnu-4570.71.2/makedefs/MakeInc.def ios-port/xnu-4570.71.2-source/makedefs/
          cp ios-port/xnu-4570.71.2/makedefs/MakeInc.top ios-port/xnu-4570.71.2-source/makedefs/
      
      - name: Show Xcode/SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find ld
          xcrun --sdk iphoneos --find mig
      
      - name: Setup build directories
        run: |
          BUILD_DIR="${{ runner.temp }}/xnu-j2-build"
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/obj" "${BUILD_DIR}/dst" "${BUILD_DIR}/sym"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "OBJROOT=${BUILD_DIR}/obj" >> $GITHUB_ENV
          echo "DSTROOT=${BUILD_DIR}/dst" >> $GITHUB_ENV
          echo "SYMROOT=${BUILD_DIR}/sym" >> $GITHUB_ENV
      
      - name: Fix python shebangs in XNU
        run: |
          find ios-port/xnu-4570.71.2-source -name "*.py" -exec sed -i '' '1s|^#!/usr/bin/python$|#!/usr/bin/env python3|' {} \;
      
      - name: Fix makekdebugevents.py (TabError + IndentationError + escape)
        run: |
          FILE="ios-port/xnu-4570.71.2-source/bsd/kern/makekdebugevents.py"
          
          echo "Checking file: $FILE"
          ls -la "$FILE"
          
          # Use Python to fix all issues at once (most reliable)
          python3 << 'PYEOF'
import sys
import os

FILEPATH = "ios-port/xnu-4570.71.2-source/bsd/kern/makekdebugevents.py"

if not os.path.exists(FILEPATH):
    print(f"ERROR: File not found: {FILEPATH}")
    sys.exit(1)

print(f"Fixing {FILEPATH}")

with open(FILEPATH, 'r') as f:
    content = f.read()

print(f"Original file size: {len(content)} chars")

# 1. Replace all tabs with 4 spaces
content = content.replace('\t', '    ')

# 2. Fix invalid escape sequence \s -> \\s
content = content.replace('\\s', '\\\\s')

# 3. Fix indentation - normalize all indentation to 4 spaces per level
lines = content.splitlines(keepends=True)
fixed = []
indent_level = 0
for i, line in enumerate(lines):
    stripped = line.lstrip()
    
    # Detect dedent keywords
    if stripped.startswith(('except:', 'else:', 'elif ', 'finally:')):
        indent_level = max(0, indent_level - 1)
    elif stripped.startswith('else:') or stripped.startswith('except:'):
        indent_level = max(0, indent_level - 1)
    
    # Calculate expected indent
    expected_indent = '    ' * indent_level
    
    # Apply correct indentation
    if stripped:
        fixed.append(expected_indent + stripped)
    else:
        fixed.append(line)
    
    # Detect indent increase
    if stripped.endswith(':'):
        # Check if it's a control statement that increases indent
        if any(stripped.startswith(kw) for kw in ['if ', 'elif ', 'else:', 'for ', 'while ', 'try:', 'except:', 'finally:', 'with ', 'def ', 'class ', 'with ']):
            indent_level += 1
        # Handle 'else:' and 'except:' which don't increase indent but the next line should be indented
        elif stripped == 'else:' or stripped.startswith('except:'):
            indent_level += 1

content = ''.join(fixed)

with open(FILEPATH, 'w') as f:
    f.write(content)

# Verify the fix
with open(FILEPATH, 'r') as f:
    verify_content = f.read()

if '\t' in verify_content:
    print("WARNING: Tabs still present after fix!")
else:
    print("OK: No tabs found")

if '\\s' in verify_content and '\\\\s' not in verify_content:
    print("WARNING: Unescaped \\s still present!")
else:
    print("OK: Escape sequences fixed")

print('Fixed makekdebugevents.py')
PYEOF
      
      - name: Build XNU 4570 ARMv7 J2
        working-directory: ios-port/xnu-4570.71.2-source
        env:
          OBJROOT: ${{ env.OBJROOT }}
          DSTROOT: ${{ env.DSTROOT }}
          SYMROOT: ${{ env.SYMROOT }}
        run: |
          set -o pipefail
          make \
            TARGET_CONFIGS="RELEASE ARM J2" \
            ARCH_CONFIGS=ARM \
            MACHINE_CONFIGS=J2 \
            KERNEL_CONFIGS=RELEASE \
            PLATFORM=iPhoneOS \
            SDKROOT=iphoneos \
            SDKVERSION=10.0 \
            BUILD_LTO=0 \
            BUILD_DSYM=0 \
            BUILD_WERROR=0 \
            CTFCONVERT=/usr/bin/true \
            CTFMERGE=/usr/bin/true \
            CTFINSERT=/usr/bin/true \
            EMBEDDED_DEVICE_MAP=/dev/null \
            OBJROOT="${OBJROOT}" \
            DSTROOT="${DSTROOT}" \
            SYMROOT="${SYMROOT}" \
            all 2>&1 | tee "${BUILD_DIR}/build.log"
      
      - name: Check build result
        if: always()
        run: |
          BUILD_RESULT=${PIPESTATUS[0]}
          echo "Build exit code: ${BUILD_RESULT}"
          
          echo "=== Kernel artifacts ==="
          find "${OBJROOT}" -name 'mach*' -o -name 'kernel*' 2>/dev/null | head -20 || true
          find "${SYMROOT}" -name 'mach*' -o -name 'kernel*' 2>/dev/null | head -20 || true
          
          if [ ${BUILD_RESULT} -ne 0 ]; then
            echo "=== Build FAILED - Last 200 lines ==="
            tail -200 "${BUILD_DIR}/build.log"
            exit 1
          else
            echo "=== Build SUCCESS ==="
          fi
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-build-log
          path: |
            ${{ env.BUILD_DIR }}/build.log
          if-no-files-found: ignore
      
      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-kernel
          path: |
            ${{ env.OBJROOT }}/**/mach*
            ${{ env.SYMROOT }}/**/mach*
          if-no-files-found: ignore
      
      - name: Summary
        if: always()
        run: |
          BUILD_RESULT=${PIPESTATUS[0]}
          if [ ${BUILD_RESULT} -eq 0 ]; then
            echo "## ✅ SUCCESS: XNU 4570 ARMv7 J2 enlazado correctamente" >> $GITHUB_STEP_SUMMARY
            echo "Kernel listo para siguiente fase (shim/loader + drivers)." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ FAILED: Errores de enlace/compilation" >> $GITHUB_STEP_SUMMARY
            echo "Ver build.log en artifacts para detalles." >> $GITHUB_STEP_SUMMARY
          fi