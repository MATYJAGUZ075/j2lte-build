      - name: "Filtro .repo opción A (blobs) + guards"
        working-directory: /home/runner/los20
        run: |
          set -e
          # OPCIÓN A validada en /tmp/repo-test (prueba reversible 2026-09-21):
          # conserva commits+tags+trees, elimina SOLO blobs. Mantiene
          # `repo manifest -r` y setlocalversion (rev-parse + diff-index).
          # NO elimina .repo, NO usa manifest slim, NO toca device/kernel/vendor.
          echo "=== FILTRO-A .repo ANTES ==="
          df -h /
          du -sh .repo 2>/dev/null || true
          du -sh .repo/project-objects 2>/dev/null || true
          du -sh .repo/projects 2>/dev/null || true
          FREE_BEFORE_MB=$(df -B1 / | awk 'NR==2{print int($4/1048576)}')
          echo "FREE_BEFORE_MB=$FREE_BEFORE_MB"

          # G1: manifest baseline (si falla aquí, el sync ya está roto -> abort).
          python3 .repo/repo/repo manifest -o /tmp/manifest-before.xml -r
          test -s /tmp/manifest-before.xml || { echo "::error::manifest-before vacío -> abort"; exit 1; }
          echo "OK: manifest-before capturado"

          # G2: todos los HEAD resuelven ANTES (baseline del sync).
          UNRES_BEFORE=$(repo forall -c 'git rev-parse --verify -q HEAD >/dev/null 2>&1 || echo "UNRESOLVED:$REPO_PATH"' 2>/dev/null || true)
          if [ -n "$UNRES_BEFORE" ]; then
            echo "::error::HEADs sin resolver ANTES del filtrado -> abort (sync incompleto):"
            echo "$UNRES_BEFORE" | head -10
            exit 1
          fi
          echo "OK: todos los HEAD resuelven antes del filtrado"

          # --- driver validado: script temporal + xargs -P4 (mismo patrón
          # que la prueba /tmp/repo-test 2515/2515; sin export -f) ---
          ROOT="$(pwd)"
          case "$ROOT" in
            */los20) ;;
            *) echo "::error::cwd inesperado ($ROOT), se esperaba .../los20 -> abort"; exit 1 ;;
          esac
          test -d .repo -a -f build/envsetup.sh || { echo "::error::no es checkout los20 -> abort"; exit 1; }
          cat > /tmp/filter-one-ci.sh <<'FILTER_EOF'
          #!/bin/bash
          # Filtra UN git dir: conserva commits+tags+trees, elimina solo blobs.
          # Lógica idéntica a filter-one.sh validado en /tmp/repo-test.
          # Uso: filter-one-ci.sh <gitdir-relativo-al-checkout>
          g="$1"
          LOG=/tmp/filter-a.log
          case "$g" in
            .repo/*) ;;
            *) echo "RECHAZADO (fuera de .repo): $g" >>"$LOG"; exit 2 ;;
          esac
          case "$g" in
            .repo/repo*|.repo/manifests*) echo "SKIP(tool) $g" >>"$LOG"; exit 0 ;;
          esac
          [ -d "$g/objects" ] || { echo "SKIP(no-objects) $g" >>"$LOG"; exit 0; }
          # Los stores de CI pueden no traer objects/pack/ (objetos loose);
          # se crea (a través del symlink comparte el store real; idempotente).
          mkdir -p "$g/objects/pack" 2>/dev/null \
            || { echo "FAIL(mkdir) $g" >>"$LOG"; exit 1; }
          keep="$(mktemp)"
          git -C "$g" cat-file --batch-check --batch-all-objects 2>/dev/null \
            | awk '$2=="commit"||$2=="tree"||$2=="tag"{print $1}' > "$keep"
          n=$(wc -l < "$keep")
          if [ "$n" -eq 0 ]; then echo "SKIP(empty) $g" >>"$LOG"; rm -f "$keep"; exit 0; fi
          if ! git -C "$g" pack-objects --depth=0 --non-empty "$PWD/$g/objects/pack/keep-pack" < "$keep" >>"$LOG" 2>&1; then
            echo "FAIL(pack) $g" >>"$LOG"; rm -f "$keep"; exit 1
          fi
          rm -f "$keep"
          newidx=$(ls "$g"/objects/pack/keep-pack-*.idx 2>/dev/null | head -1)
          [ -n "$newidx" ] || { echo "FAIL(no-newidx) $g" >>"$LOG"; exit 1; }
          nb=$(git verify-pack -v "$newidx" 2>/dev/null | awk '$2=="blob"' | wc -l)
          [ "$nb" -eq 0 ] || { echo "FAIL(blobs=$nb) $g" >>"$LOG"; rm -f "$g"/objects/pack/keep-pack-*; exit 1; }
          if ! git -C "$g" rev-parse --all >/dev/null 2>&1; then
            echo "FAIL(refs) $g" >>"$LOG"; rm -f "$g"/objects/pack/keep-pack-*; exit 1
          fi
          # Recién ahora: borrar packs viejos + loose blobs (nunca trees/commits/tags).
          find "$g/objects/pack" \( -name 'pack-*.pack' -o -name 'pack-*.idx' -o -name 'pack-*.rev' -o -name 'pack-*.bitmap' -o -name 'pack-*.promisor' \) ! -name 'keep-pack-*' -delete
          # Borrado batcheado de loose-blobs (una sola invocación git;
          # conjunto idéntico al loop anterior: solo paths loose cuyo objeto es blob).
          git -C "$g" cat-file --batch-check --batch-all-objects 2>/dev/null \
            | awk '$2=="blob" {print substr($1,1,2)"/"substr($1,3)}' \
            | while read -r p; do rm -f "$g/objects/$p"; done
          echo "OK $g" >>"$LOG"
          exit 0
          FILTER_EOF
          : > /tmp/filter-a.log
          : > /tmp/filter-a.err
          # Dedup por store real: mirrors (.repo/projects) y stores
          # (.repo/project-objects) comparten objects/ por symlink; se
          # procesa cada store UNA vez (prefiere ruta project-objects).
          find .repo -name "*.git" -type d | while read -r _g; do
            [ -d "$_g/objects" ] || continue
            _r=$(realpath "$_g/objects" 2>/dev/null) || continue
            echo "$_r $_g"
          done | sort -k1,1 -k2,2 | awk '!seen[$1]++ {print $2}' \
            | xargs -P 4 -I{} bash /tmp/filter-one-ci.sh "{}" 2>>/tmp/filter-a.err || XARGS_EXIT=$?
          XARGS_EXIT=${XARGS_EXIT:-0}
          echo "XARGS_EXIT=$XARGS_EXIT"
          echo "--- filter-a.log (primeras 20 líneas):"
          head -20 /tmp/filter-a.log
          echo "--- child stderr (primeras 20 líneas):"
          head -20 /tmp/filter-a.err
          echo "filtrados OK: $(grep -c '^OK' /tmp/filter-a.log || true) FAIL: $(grep -c '^FAIL' /tmp/filter-a.log || true)"
          test "$XARGS_EXIT" = "0" \
            || { echo "::error::xargs exit=$XARGS_EXIT -> abort"; exit 1; }
          test "$(grep -c '^FAIL' /tmp/filter-a.log || true)" = "0" \
            || { echo "::error::hubo FAILs en filtrado -> abort"; exit 1; }

          # G3: manifest DESPUÉS debe funcionar y ser idéntico al baseline.
          python3 .repo/repo/repo manifest -o /tmp/manifest-after.xml -r \
            || { echo "::error::repo manifest -r falló DESPUÉS del filtrado -> abort"; exit 1; }
          diff -q /tmp/manifest-before.xml /tmp/manifest-after.xml \
            || { echo "::error::el manifest CAMBIÓ tras el filtrado -> abort"; exit 1; }
          echo "OK: manifest idéntico antes/después"

          # G4: todos los HEAD resuelven DESPUÉS (objetos requeridos presentes).
          UNRES_AFTER=$(repo forall -c 'git rev-parse --verify -q HEAD >/dev/null 2>&1 || echo "UNRESOLVED:$REPO_PATH"' 2>/dev/null || true)
          if [ -n "$UNRES_AFTER" ]; then
            echo "::error::HEADs sin resolver DESPUÉS del filtrado -> abort (objeto requerido ausente):"
            echo "$UNRES_AFTER" | head -10
            exit 1
          fi
          echo "OK: todos los HEAD resuelven después del filtrado"

          # G5: operaciones git de setlocalversion (kernel) siguen funcionando.
          KDIR="kernel/samsung/exynos3475"
          git -C "$KDIR" rev-parse --verify --short HEAD >/dev/null \
            || { echo "::error::kernel rev-parse HEAD falló -> abort"; exit 1; }
          git -C "$KDIR" diff-index --name-only HEAD >/dev/null \
            || { echo "::error::kernel diff-index HEAD falló -> abort"; exit 1; }
          echo "OK: setlocalversion (rev-parse + diff-index) funciona"

          echo "=== FILTRO-A .repo DESPUÉS ==="
          df -h /
          du -sh .repo 2>/dev/null || true
          du -sh .repo/project-objects 2>/dev/null || true
          du -sh .repo/projects 2>/dev/null || true
          FREE_AFTER_MB=$(df -B1 / | awk 'NR==2{print int($4/1048576)}')
          echo "FREE_BEFORE_MB=$FREE_BEFORE_MB FREE_AFTER_MB=$FREE_AFTER_MB RECUPERADO_MB=$((FREE_AFTER_MB - FREE_BEFORE_MB))"
          test -d .repo/projects \
            && echo "OK: .repo/projects conservado" \
            || { echo "::error::.repo/projects desapareció -> abort"; exit 1; }

      - name: Upload filter-a forense (solo si el filtro falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: filter-a-${{ github.run_id }}
          path: |
            /tmp/filter-a.log
            /tmp/filter-a.err
            /tmp/manifest-before.xml
            /tmp/manifest-after.xml
          if-no-files-found: warn
          retention-days: 3

      # ============================================================
      # BUILD CONFIG
      # ============================================================

      - name: Toolchain del kernel (experimento A/B)
        working-directory: /home/runner/los20
        run: |
          set -e
          case "$AB_KERNEL_TC" in
            clang)
              echo "kernel_toolchain=clang (CI estandar, sin cambios)"
              ;;
            gcc)
              CFG=device/samsung/universal3475-common/BoardConfigCommon.mk
              test -f "$CFG" || { echo "::error::falta $CFG"; exit 2; }
              # Inyección EFÍMERA: solo en el checkout del runner; no commitea nada.
              printf '\n# [A/B experiment] kernel con GCC 4.9 (kernel.mk: CLANG_COMPILE=false -> CC=arm-linux-androidkernel-gcc, sin deps clang salvo HOSTCC)\nTARGET_KERNEL_CLANG_COMPILE := false\n' >> "$CFG"
              grep -n "TARGET_KERNEL_CLANG_COMPILE" "$CFG"
              # HOSTLDFLAGS/HOSTCFLAGS usan -fuse-ld=lld -> asegurar ld.lld en PATH.
              echo "/home/runner/los20/prebuilts/clang/host/linux-x86/clang-r450784d/bin" >> "$GITHUB_PATH"
              echo "kernel_toolchain=gcc -> TARGET_KERNEL_CLANG_COMPILE=false inyectado"
              ;;
            *)
              echo "::error::kernel_toolchain inválido: $AB_KERNEL_TC"
              exit 64
              ;;
          esac

      - name: Inyección pstore/ramoops (diagnóstico boot colgado)
        if: ${{ inputs.pstore_diag == true }}
        working-directory: /home/runner/los20
        run: |
          set -e
          KDIR=kernel/samsung/exynos3475
          CFG=""
          for c in arch/arm/configs/lineage_j2lte_defconfig arch/arm/configs/lineage-j2lte_defconfig; do
            if [ -f "$KDIR/$c" ]; then
              CFG="$KDIR/$c"
              break
            fi
          done
          test -n "$CFG" || { echo "::error::defconfig no encontrado (lineage_j2lte_defconfig/lineage-j2lte_defconfig) en $KDIR"; exit 2; }
          printf '\n# [diag pstore] kernel-console + ram-console en RAM -> sobreviven warm reboot (leer /proc/last_kmsg y /sys/fs/pstore desde recovery)\nCONFIG_PSTORE=y\nCONFIG_PSTORE_CONSOLE=y\nCONFIG_PSTORE_RAM=y\nCONFIG_ANDROID=y\nCONFIG_ANDROID_RAM_CONSOLE=y\nCONFIG_ANDROID_RAM_CONSOLE_ENABLE_VERBOSE=y\n' >> "$CFG"
          grep -nE "CONFIG_(PSTORE|ANDROID_RAM_CONSOLE)" "$CFG"
          echo "OK: pstore/ramoops inyectado en $CFG"

      - name: Configurar lunch
        working-directory: /home/runner/los20
        run: |
          set -e

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug

      - name: Resolver target
        working-directory: /home/runner/los20
        run: |
          set -e

          case "$STAGE" in
            systemimage-guard)
              TARGET="systemimage"
              ;;
            bootimage)
              TARGET="bootimage"
              ;;
            recoveryimage)
              TARGET="recoveryimage"
              ;;
            *)
              echo "::error::Stage inválido: $STAGE"
              exit 64
              ;;
          esac

          echo "REQUESTED_STAGE=$STAGE"
          echo "RESOLVED_TARGET=$TARGET"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      # ============================================================
      # GUARD
      # ============================================================

      - name: Guard de espacio para systemimage
        if: ${{ github.event.inputs.stage == 'systemimage-guard' }}
        run: |
          set -e

          AVAIL_GB=$(
            df --output=avail -BG / |
            tail -1 |
            tr -dc '0-9'
          )

          MIN="${MIN_FREE_GB:-40}"

          echo "Espacio libre: ${AVAIL_GB}G"
          echo "Mínimo requerido: ${MIN}G"

          if [ "$AVAIL_GB" -lt "$MIN" ]; then
            echo "::error::No hay espacio suficiente para systemimage."
            echo "::error::Libres: ${AVAIL_GB}G / requeridos: ${MIN}G"
            exit 90
          fi

      # ============================================================
      # BUILD
      # ============================================================

      - name: Medición de disco ANTES del build
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== DISCO ANTES DE mka $STAGE ==="
          df -h /
          du -sh out 2>/dev/null || true
          echo "=== Directorios más grandes en out/ ==="
          du -sh out/* 2>/dev/null | sort -h | tail -20 || true

      - name: Diagnóstico de almacenamiento fuera de out
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "===== STORAGE DIAGNOSTIC: BEFORE SYSTEMIMAGE ====="
          df -h /
          echo "===== TOP-LEVEL DIRECTORIES ====="
          du -sh /tmp /var/tmp /home/runner/.cache /home/runner/* 2>/dev/null | sort -h
          echo "===== SYSTEM DIRECTORIES ====="
          du -sh /opt/* /usr/share/* /var/log/* 2>/dev/null | sort -h | tail -30
          echo "===== END STORAGE DIAGNOSTIC ====="

      - name: Inspección read-only de runner-cache y Gradle
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== /opt/runner-cache ==="
          sudo du -sh /opt/runner-cache 2>/dev/null || true
          sudo ls -lah /opt/runner-cache 2>/dev/null || true
          sudo du -sh /opt/runner-cache/* 2>/dev/null | sort -h || true
          echo "=== /opt/actionarchivecache ==="
          sudo du -sh /opt/actionarchivecache 2>/dev/null || true
          sudo ls -lah /opt/actionarchivecache 2>/dev/null || true
          sudo du -sh /opt/actionarchivecache/* 2>/dev/null | sort -h || true
          echo "=== GRADLE EN PATH/WORKFLOW ==="
          command -v gradle || echo "gradle no está en PATH"
          ls -d /usr/share/gradle-9.7.1 2>/dev/null || echo "/usr/share/gradle-9.7.1 no existe"
          echo "=== KOTLINC (candidata registrada 94M, NO borrar) ==="
          du -sh /usr/share/kotlinc 2>/dev/null || true

      - name: Limpieza tardía symbols (una vez, solo systemimage sin EXTRA)
        id: symbolsclean
        background: true
        working-directory: /home/runner/los20
        run: |
          set +e
          # Gate estricto: solo STAGE=systemimage (TARGET resuelto) y EXTRA
          # vacío. Cualquier otro caso: salir sin tocar nada.
          if [ "${TARGET:-}" != "systemimage" ]; then
            echo "skip: TARGET=$TARGET no es systemimage -> sin limpieza"
            exit 0
          fi
          if [ -n "${EXTRA:-}" ]; then
            echo "skip: EXTRA no vacío ($EXTRA) -> sin limpieza (dist/ota podrían necesitar symbols/)"
            exit 0
          fi
          SYMDIR="out/target/product/j2lte/symbols"
          BRKDIR="out/target/product/j2lte/breakpad"
          FLAG="/tmp/SYMBOLS_CLEANED"
          # Bucle vigilante: dispara UNA sola vez al cruzar el umbral tardío
          # (~90% ninja) o symbols/>1G con progreso >85%. Las copias son
          # order-only por diseño (dynamic_binary.mk:86-89): borrarlas no
          # fuerza rebuilds; systemimage filtra TARGET_OUT y nunca las lee.
          while [ ! -e /tmp/BUILD_DONE ]; do
            PROG="$(grep -aoE '\[ *[0-9]+% +[0-9]+/[0-9]+\]' /tmp/stage.log 2>/dev/null | tail -1 || true)"
            PCT="$(echo "$PROG" | grep -oE '[0-9]+%' | tr -d '%' | head -1)"
            PCT="${PCT:-0}"
            SYMSZ="$(du -sb "$SYMDIR" 2>/dev/null | cut -f1 || echo 0)"
            SYMSZ="${SYMSZ:-0}"
            FIRE=0
            [ "$PCT" -ge 90 ] && FIRE=1
            if [ "$SYMSZ" -gt 1073741824 ] && [ "$PCT" -gt 85 ]; then FIRE=1; fi
            if [ "$FIRE" = "1" ] && [ ! -e "$FLAG" ]; then
              echo "### LIMPIEZA SYMBOLS pct=${PCT}% symsize=${SYMSZ}B -> rm UNA vez ###"
              df -h / | head -2
              rm -rf "$SYMDIR" "$BRKDIR" 2>/dev/null || true
              touch "$FLAG" 2>/dev/null || true
              df -h / | head -2
              break
            fi
            sleep 60
          done
          echo "fin vigía symbols (BUILD_DONE o ya disparado)"

      - name: Build targets
        id: build
        background: true
        working-directory: /home/runner/los20
        run: |
          set -o pipefail

          # --- MONITOR DE DISCO (distinguir ENOSPC / kill externo / runner) ---
          LOG=/tmp/disk-monitor.log
          : > "$LOG"
          TELEM_FREE_GB_MB=$(( (${TELEM_FREE_GB:-25}) * 1024 ))

          ninja_progress() {
            grep -aoE '\[ *[0-9]+% +[0-9]+/[0-9]+\]' /tmp/stage.log 2>/dev/null \
              | tail -1 || true
          }

          dmesg_probe() {
            local out
            out=$(dmesg --ctime 2>/dev/null) || out="$(sudo -n dmesg --ctime 2>/dev/null)" || { echo "dmesg: no disponible"; return 0; }
            echo "$out" | grep -aiE 'out of memory|oom-kill|Killed process|hardware error|Call Trace|blk_update_request|I/O error' | tail -6
          }

          dmesg_tail() {
            local out
            out=$(dmesg --ctime 2>/dev/null) || out="$(sudo -n dmesg --ctime 2>/dev/null)" || { echo "dmesg: no disponible"; return 0; }
            echo "$out" | tail -40
          }

          state_cheap() {
            echo "ninja: $(ninja_progress)"
            df -h /
            df -i /
            echo "procs: clang=$(pgrep -c -f clang 2>/dev/null||echo 0) cc1plus=$(pgrep -c cc1plus 2>/dev/null||echo 0) ninja=$(pgrep -c ninja 2>/dev/null||echo 0)"
            grep -E 'Mem:|Swap:' /proc/meminfo
          }

          monitor_normal() {
            echo "=== $(date -u +%FT%T) [NORMAL 5min] ==="
            state_cheap
            du -sb -- out out/soong/.intermediates out/target/common/obj \
              out/target/product/j2lte/obj out/target/product/j2lte/symbols \
              2>/dev/null
            echo "--- top dirs out/ ---"
            du -sh out/* 2>/dev/null | sort -h | tail -20
            echo "--- archivos que crecieron en los últimos 5 min ---"
            find out -newermt '5 minutes ago' -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -15
          }

          monitor_dense() {
            echo "=== $(date -u +%FT%T) [DENSOS 5s] ==="
            state_cheap
            timeout 30 du -sh out 2>/dev/null
            timeout 30 du -sh out/soong 2>/dev/null
            timeout 30 du -sh out/host 2>/dev/null
            timeout 30 du -sh out/target 2>/dev/null
            timeout 30 du -sh out/soong/.intermediates/external/webrtc 2>/dev/null || true
            echo "--- dmesg ---"
            dmesg_probe
          }

          last_gasp() {
            echo "### BAJISMO free -> volcado final ###"
            df -h /
            df -i /
            free -m
            echo "ninja: $(ninja_progress)"
            ps -eo pid,ppid,stat,etime,args --sort=-%cpu | head -30
            pgrep -af 'clang|cc1plus|ninja|mka' || true
            echo "uptime: $(uptime)"
            dmesg_tail
          }

          (
            set +e
            while :; do
              free_mb=$(df -B1 / | awk 'NR==2{print $4/1048576}')
              if [ "${free_mb%.*}" -lt "$TELEM_FREE_GB_MB" ]; then
                echo "### UMBRAL ${TELEM_FREE_GB:-25}GB free=${free_mb}MB -> muestreo denso cada 5s ###" | tee -a "$LOG"
                while :; do
                  monitor_dense | tee -a "$LOG"
                  f2=$(df -B1 / | awk 'NR==2{print $4/1048576}')
                  if [ "${f2%.*}" -lt 100 ]; then
                    last_gasp | tee -a "$LOG" 2>&1
                    # Emergency checkpoint: marcar UNA sola vez para que el
                    # guardia dispare el upload sin detener mka (umbral 100MB).
                    if [ ! -e /tmp/EMERGENCY ]; then
                      touch /tmp/EMERGENCY 2>/dev/null || true
                    fi
                    break
                  fi
                  sleep 5
                done
              else
                monitor_normal | tee -a "$LOG"
                sleep 300
              fi
            done
          ) &
          MON_PID=$!
          trap 'touch /tmp/BUILD_DONE 2>/dev/null || true; kill "$MON_PID" 2>/dev/null; wait "$MON_PID" 2>/dev/null || true; cat "$LOG" >&2' EXIT
          # --- FIN MONITOR ---

          export WITH_DEXPREOPT=false

          echo "=== WITH_DEXPREOPT=$WITH_DEXPREOPT ==="

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug >/dev/null

          ALL_TARGETS="$TARGET"

          if [ -n "$EXTRA" ]; then
            OLD_IFS="$IFS"
            IFS=','

            for extra in $EXTRA; do
              case "$extra" in
                bootimage|recoveryimage)
                  ;;
                *)
                  echo "::error::Target extra inválido: $extra"
                  exit 66
                  ;;
              esac
            done

            IFS="$OLD_IFS"
            ALL_TARGETS="$ALL_TARGETS,$EXTRA"
          fi

          echo "SECUENCIA=$ALL_TARGETS"

          OLD_IFS="$IFS"
          IFS=','

          for target in $ALL_TARGETS; do
            case "$target" in
              bootimage|recoveryimage|systemimage)
                ;;
              *)
                echo "::error::Target no permitido: $target"
                exit 66
                ;;
            esac

            echo "== mka $target =="

            # Prueba MINIMIZE (override por línea de comandos, pisa el `:=`
            # por ser asignación de línea de comandos; no toca device tree):
            # recorta tablas de variables locales java (-g:source,lines).
            time mka --skip-soong-tests PRODUCT_MINIMIZE_JAVA_DEBUG_INFO=true "$target" -j"$(nproc)" \
              2>&1 | tee /tmp/stage.log

            RC=${PIPESTATUS[0]}

            if [ "$RC" -ne 0 ]; then
              echo "STAGE_EXIT=$RC ($target)"
              exit "$RC"
            fi

            echo "OK: $target"
            df -h /
          done

          IFS="$OLD_IFS"

      - name: Guardia emergency checkpoint
        id: guardia
        run: |
          set +e
          # Espera flag de emergencia o fin del build (con deadline propio para
          # no colgar el job). Solo prepara snapshots si hubo emergencia.
          EMERG=/tmp/EMERGENCY
          DONE=/tmp/BUILD_DONE
          OUT="$GITHUB_WORKSPACE/artifacts-emergency"
          END=$(( $(date +%s) + 19800 ))
          while [ ! -e "$EMERG" ] && [ ! -e "$DONE" ] && [ $(date +%s) -lt $END ]; do
            sleep 30
          done
          if [ -e "$EMERG" ]; then
            mkdir -p "$OUT" 2>/dev/null || true
            df -h / > "$OUT/df-final.txt" 2>&1 || true
            du -sh /home/runner/los20/out 2>/dev/null > "$OUT/du-final.txt" || true
            gzip -c /tmp/disk-monitor.log > "$OUT/disk-monitor.log.gz" 2>/dev/null || true
            gzip -c /tmp/stage.log > "$OUT/stage.log.gz" 2>/dev/null || true
            echo "emergency=true" >> "$GITHUB_OUTPUT"
          else
            echo "emergency=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload emergency checkpoint
        if: steps.guardia.outputs.emergency == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emergency-telemetry-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts-emergency/
          if-no-files-found: warn
          retention-days: 3

      - name: Wait build
        wait: [build]

      - name: Rescate de telemetría ante fallo/ENOSPC/kill
        if: always()
        run: |
          set +e
          echo "=== RESCATE TELEMETRÍA ==="
          df -h / 2>&1
          df -i / 2>&1
          free -m 2>&1

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for f in /tmp/stage.log /tmp/disk-monitor.log; do
            if [ -f "$f" ]; then
              gzip -c "$f" > "$GITHUB_WORKSPACE/artifacts/$(basename "$f").gz" 2>/dev/null \
                || cp "$f" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null
            fi
          done

          ps -eo pid,ppid,stat,etime,comm,args --sort=-%mem | head -30 \
            > "$GITHUB_WORKSPACE/artifacts/ps-final.txt" 2>&1

          pgrep -af 'clang|cc1plus|ninja|mka' > "$GITHUB_WORKSPACE/artifacts/procs-final.txt" 2>&1 || true
          echo "uptime: $(uptime)" >> "$GITHUB_WORKSPACE/artifacts/procs-final.txt"

          if ! dmesg --ctime 2>/dev/null | tail -40 > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"; then
            if ! sudo -n dmesg --ctime 2>/dev/null | tail -40 > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"; then
              echo "dmesg: no disponible" > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"
            fi
          fi

          echo "--- contenido de artifacts/ ---"
          ls -la "$GITHUB_WORKSPACE/artifacts/" 2>&1

      # ============================================================
      # RESULTADOS
      # ============================================================

      - name: Medición de disco DESPUÉS del build
        if: always()
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== DISCO DESPUÉS DEL BUILD ==="
          df -h /
          du -sh out 2>/dev/null || true
          echo "=== Directorios más grandes en out/ ==="
          du -sh out/* 2>/dev/null | sort -h | tail -20 || true

      - name: Recopilar artefactos
        if: always()
        working-directory: /home/runner/los20
        run: |
          set +e

          df -h /
          du -sm out 2>/dev/null || true

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          PRODUCT=out/target/product/j2lte

          cp "$PRODUCT/boot.img" \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          cp "$PRODUCT/recovery.img" \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          cp "$PRODUCT/system.img" \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          cp /tmp/stage.log \
            "$GITHUB_WORKSPACE/artifacts/stage.log" 2>/dev/null || true

          cp /tmp/disk-monitor.log \
            "$GITHUB_WORKSPACE/artifacts/disk-monitor.log" 2>/dev/null || true

      - name: Upload artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ github.event.inputs.stage }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

      - name: Copiar forense kernel (fuera del workspace -> dentro)
        if: ${{ always() && (github.event.inputs.stage == 'bootimage' || github.event.inputs.kernel_toolchain == 'gcc') }}
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/kernel-forensic"
          KOBJ=/home/runner/los20/out/target/product/j2lte/obj/KERNEL_OBJ
          cp "$KOBJ/.config" "$GITHUB_WORKSPACE/kernel-forensic/" 2>/dev/null || echo "skip: .config ausente"
          cp "$KOBJ/arch/arm/boot/zImage-dtb" "$GITHUB_WORKSPACE/kernel-forensic/" 2>/dev/null || echo "skip: zImage-dtb ausente"
          cp "$KOBJ"/arch/arm/boot/dts/exynos3475-j2lte_swa_open_*.dtb "$GITHUB_WORKSPACE/kernel-forensic/" 2>/dev/null || echo "skip: dtbs ausentes"
          ls -la "$GITHUB_WORKSPACE/kernel-forensic/"

      - name: Upload kernel forense (A/B toolchain)
        if: ${{ always() && (github.event.inputs.stage == 'bootimage' || github.event.inputs.kernel_toolchain == 'gcc') }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-forensic-${{ github.event.inputs.kernel_toolchain }}-${{ github.run_id }}
          path: kernel-forensic/
          if-no-files-found: warn
