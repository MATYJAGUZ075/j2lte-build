# los20-build-full.yml — BUILD COMPLETO de LineageOS 20 para j2lte
#
# FIX-018 (2026-08-23): separado del lunch-check (que permanece intacto).
# FIX-028: kernel genera zImage-dtb con DTB incorporado.
# FIX-029: adaptación Clang del kernel 3.10.
# FIX-030 (2026-08-29): sincronizado con las optimizaciones probadas en
#   los20-build-stages.yml — symlinks de compat (libncurses/libtinfo/libc++),
#   WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=true, diagnóstico de
#   almacenamiento, stats de ccache y medición de out/ antes y después del
#   build. No se agrega selector de stage (systemimage/boot/recovery): este
#   workflow sigue siendo específicamente para mka bacon.
# FIX-031 (2026-09-12): sincronizado el resto de las podas post-sync que
#   ya estaban probadas en los20-build-stages.yml (rust linux-x86 versiones
#   inactivas, module_sdk/art snapshot @3, runtime/mainline, Ronda 2, Tier 1
#   SAFE, autotest) — antes solo tenía darwin-x86 y android-emulator/
#   remoteexecution-client. El GUARD de espacio (FIX-014) se movió a DESPUÉS
#   de todas las podas (igual que en stages), no a la mitad. Se agregó
#   también el monitor de disco en vivo (muestreo normal/denso, dmesg probe,
#   last_gasp) y el rescate de telemetría ante fallo/ENOSPC, adaptados de
#   stages al target único "bacon" (sin loop de $STAGE/$EXTRA, ya que este
#   workflow no separa por etapas).
# FIX-032 (2026-09-13): sincronizados 3 agregados nuevos de
#   los20-build-stages.yml: env SKIP_ABI_CHECKS=true (salta ABI dumps
#   .sdump/.lsdump, leído por Soong vía IsEnvTrue en cc/sabi.go); step de
#   limpieza controlada de Swift preinstalado + toolchains extra (miniconda,
#   pipx, az, microsoft) justo después de liberar espacio del runner; y
#   step de diagnóstico de almacenamiento fuera de out/ (tmp, caches, opt,
#   usr/share, var/log) antes del build, condicionado a mode=='full-bacon'
#   igual que el resto de la sección de build de este workflow.
# FIX-033 (2026-09-17): ccache ELIMINADO por completo, igual que en
#   los20-build-stages.yml (run de esa etapa demostró que se puede recuperar
#   ~1G de runner y simplificar el step de dependencias sin restore/save de
#   actions/cache). NO re-agregar USE_CCACHE, CCACHE_EXEC, CCACHE_DIR,
#   restore/save de actions/cache, instalación del binario, ni stats de
#   ccache sin autorización explícita. Se sincronizaron también las 4 podas
#   post-sync que faltaban de stages: limpieza off-out (kotlinc/gradle/
#   runner-cache/actionarchivecache no usadas por este workflow), sdk/32,
#   extras profiling (system/extras/ioshark) y Darwin arch remnants (jdk11/
#   jdk8/build-tools/extract-tools/misc darwin-x86/darwin-arm64). Se agregó
#   también el step de diagnóstico "Inspección read-only de runner-cache y
#   Gradle" antes del build, igual que en stages. mka bacon sigue siendo el
#   único target de este workflow: no se agrega selector de stage ni la
#   lógica de systemimage/bootimage/recoveryimage de los20-build-stages.yml.
# FIX-034 (2026-09-17): sincronizados 2 detalles del step de build que
#   habían quedado afuera del FIX-033: (1) flag --skip-soong-tests en el
#   comando mka (mka --skip-soong-tests bacon -j..., igual orden que en
#   stages: mka --skip-soong-tests "$target" -j...); (2) el mecanismo de
#   emergency checkpoint completo — el step de build pasa a id: build +
#   background: true, el trap agrega touch /tmp/BUILD_DONE al salir, y el
#   monitor marca touch /tmp/EMERGENCY una sola vez al llegar a <100MB
#   libres. Se agregaron los steps "Guardia emergency checkpoint" (espera
#   EMERGENCY o BUILD_DONE con deadline propio y sube snapshots de
#   df/du/disk-monitor.log/bacon.log si hubo emergencia), "Upload emergency
#   checkpoint" y "Wait build" (wait: [build]), los tres condicionados a
#   mode=='full-bacon' ya que a diferencia de stages este workflow no
#   siempre construye. Target sigue siendo únicamente bacon: no se tocó el
#   loop de $STAGE/$EXTRA porque ese loop no existe aquí.
#
# IMPORTANTE / FIX-014 (INFRASTRUCTURE-BLOCKED):
#   El runner hospedado ubuntu-24.04 (~145G disco, 4 vCPU, 16G RAM) NO alcanza
#   para un bacon completo: tras repo sync quedan ~17G libres y out/ necesita
#   50–90G adicionales. Por eso este workflow tiene un GUARD de disco que
#   aborta temprano si el espacio libre post-sync es menor al mínimo exigido.
#
#   Para ejecutar un build real hace falta un runner con recursos suficientes
#   (recomendado: self-hosted con >=16 vCPU, >=64G RAM, >=400G SSD libres).
#   Uso futuro con self-hosted:
#     gh workflow run los20-build-full.yml -f runner_label=<label> -f mode=full-bacon

name: LOS20 build full (guarded)

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'runs-on label (ubuntu-24.04 | self-hosted label)'
        required: false
        default: 'ubuntu-24.04'
      mode:
        description: 'modo del run'
        required: false
        default: 'lunch-only'
        type: choice
        options:
          - lunch-only
          - full-bacon
      min_free_gb:
        description: 'GB libres mínimos post-sync para permitir bacon'
        required: false
        default: '70'
      telemetry_free_gb:
        description: 'GB libres que activan telemetría densa de diagnóstico (solo lectura)'
        required: false
        default: '25'

concurrency:
  group: los20-full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 350

    env:
      # ccache ELIMINADO por completo (ver FIX-033). NO re-agregar
      # USE_CCACHE, CCACHE_EXEC, CCACHE_DIR, restore/save de actions/cache,
      # instalación del binario, ni stats/mediciones de ccache sin
      # autorización explícita.
      # Salta la generación de ABI dumps (.sdump/.lsdump) que bacon no
      # necesita (solo los usa el goal debug findlsdumps). Reduce el pico de
      # out/soong. Leído por Soong vía IsEnvTrue en cc/sabi.go.
      SKIP_ABI_CHECKS: "true"
      TELEM_FREE_GB: ${{ github.event.inputs.telemetry_free_gb }}

    steps:

      # ============================================================
      # RUNNER
      # ============================================================

      - name: Checkout infra repo (manifests)
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Limpieza controlada de Swift preinstalado
        run: |
          set -e
          echo "=== SWIFT PRE-INSTALL ANTES ==="
          df -h /
          if [ ! -d /usr/share/swift ]; then
            echo "skip: /usr/share/swift no existe -> nada que limpiar"
            exit 0
          fi
          du -sh /usr/share/swift
          sudo rm -rf -- /usr/share/swift
          if [ -e /usr/share/swift ]; then
            echo "::error::no se pudo eliminar /usr/share/swift"
            exit 1
          fi
          echo "OK: /usr/share/swift eliminado"
          echo "=== TOOLCHAINS ADICIONALES (miniconda/pipx/az/microsoft) ==="
          for T in /usr/share/miniconda /opt/pipx /usr/share/az_15.6.1 /opt/microsoft; do
            if [ ! -e "$T" ]; then
              echo "skip: $T no existe -> nada que limpiar"
              continue
            fi
            du -sh "$T"
            sudo rm -rf -- "$T"
            if [ -e "$T" ]; then
              echo "::error::no se pudo eliminar $T"
              exit 1
            fi
            echo "OK: $T eliminado"
          done
          echo "=== SWIFT PRE-INSTALL DESPUÉS ==="
          df -h /

      - name: Limpieza controlada off-out (kotlinc/gradle/runner-2.336.0/actions no usadas)
        run: |
          set -e
          echo "=== OFF-OUT EXTRA ANTES ==="
          df -h /
          # Candidatos verificados como seguros (auditoría read-only):
          # kotlinc 94M (build usa external/kotlinc), gradle 165M (sin uso),
          # archivos 2.336.0 (agente en uso es 2.337.0, updates esperan fin
          # del job), paquetes de actions no usadas por este workflow.
          for T in \
            /usr/share/kotlinc \
            /usr/share/gradle-9.7.1 \
            /opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.gz \
            /opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.zst \
            /opt/actionarchivecache/actions_setup-node \
            /opt/actionarchivecache/actions_setup-python \
            /opt/actionarchivecache/github_codeql-action \
            /opt/actionarchivecache/github_gh-aw-actions; do
            # Allowlist estática: SOLO estas 8 rutas exactas pueden borrarse.
            # (No se verifica existencia de rutas protegidas aquí porque en
            # esta fase los20 aún no existe: lo crea repo init después.
            # Run 34792065347 demostró que exigir su existencia aborta el job.)
            case "$T" in
              /usr/share/kotlinc|/usr/share/gradle-9.7.1|/opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.gz|/opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.zst|/opt/actionarchivecache/actions_setup-node|/opt/actionarchivecache/actions_setup-python|/opt/actionarchivecache/github_codeql-action|/opt/actionarchivecache/github_gh-aw-actions)
                ;;
              *)
                echo "::error::ruta no autorizada: $T"
                exit 1
                ;;
            esac
            if [ ! -e "$T" ]; then
              echo "skip: $T no existe -> nada que limpiar"
              continue
            fi
            du -sh "$T"
            sudo rm -rf -- "$T"
            if [ -e "$T" ]; then
              echo "::error::no se pudo eliminar $T"
              exit 1
            fi
            echo "OK: $T eliminado"
          done
          echo "=== OFF-OUT EXTRA DESPUÉS ==="
          df -h /

      - name: Disco antes
        run: df -h /

      # ============================================================
      # Storage diag (traído de build-stages)
      # ============================================================

      - name: Diagnosticar almacenamiento
        run: |
          echo "=== DF ==="
          df -h

          echo
          echo "=== LSBLK ==="
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS

          echo
          echo "=== FINDMNT ==="
          findmnt

          echo
          echo "=== /mnt ==="
          ls -lah /mnt 2>/dev/null || true
          df -h /mnt 2>/dev/null || true

      # ============================================================
      # DEPENDENCIAS (ccache eliminado: ver env)
      # ============================================================

      - name: Dependencias e instalación de repo
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y git-lfs python3 curl
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name  "j2lte-ci"
          git config --global user.email "j2lte-ci@users.noreply.github.com"
          git lfs install

          # symlinks de compat (traídos de build-stages)
          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libncurses.so.6 \
            /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true

          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libtinfo.so.6 \
            /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

          sudo apt-get install -y libc++1 >/dev/null 2>&1 || \
            sudo ln -sf \
              /usr/lib/x86_64-linux-gnu/libc++.so.1 \
              /usr/lib/x86_64-linux-gnu/libc++.so || true

      # ============================================================
      # SOURCE
      # ============================================================

      - name: repo init LineageOS 20.0
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p "$HOME/los20"
          cd "$HOME/los20"
          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --git-lfs

      - name: "local_manifests: j2lte + SLSI deps"
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p .repo/local_manifests 2>/dev/null || true
          mkdir -p "$HOME/los20/.repo/local_manifests"
          cp "$GITHUB_WORKSPACE/manifests/j2lte.xml"      "$HOME/los20/.repo/local_manifests/j2lte.xml"
          cp "$GITHUB_WORKSPACE/manifests/j2lte-slsi.xml" "$HOME/los20/.repo/local_manifests/j2lte-slsi.xml"
          if [ -f "$GITHUB_WORKSPACE/manifests/j2lte-slim.xml" ]; then
            cp "$GITHUB_WORKSPACE/manifests/j2lte-slim.xml" "$HOME/los20/.repo/local_manifests/j2lte-slim.xml"
          fi
          cat "$HOME/los20/.repo/local_manifests/"*.xml

      - name: repo sync (-c --no-tags)
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          cd "$HOME/los20"
          echo "=== DISCO PRE-SYNC ==="
          df -h /
          time repo sync -c --no-tags --fail-fast -j4
          echo "=== DISCO POST-SYNC ==="
          df -h /

      # ============================================================
      # PODAS POST-SYNC (sincronizadas desde los20-build-stages.yml)
      # ============================================================

      - name: Poda post-sync (prebuilts/rust/darwin-x86)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RUST DARWIN ANTES ==="
          df -h /
          du -sh prebuilts/rust/darwin-x86 2>/dev/null || true

          # Verificaciones de seguridad: debe existir como directorio
          if [ ! -d "prebuilts/rust/darwin-x86" ]; then
            echo "::error::Directorio esperado no existe: prebuilts/rust/darwin-x86 -> se aborta la poda"
            exit 1
          fi

          # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
          PARENT="$(cd prebuilts/rust/darwin-x86 && pwd)"
          EXPECTED="$(pwd)/prebuilts/rust/darwin-x86"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "::error::Resolución inesperada para prebuilts/rust/darwin-x86 ($PARENT != $EXPECTED) -> abort"
            exit 1
          fi

          # Verificar que la toolchain linux-x86 (única usada en runner Linux) SÍ existe
          if [ ! -d "prebuilts/rust/linux-x86" ]; then
            echo "::error::prebuilts/rust/linux-x86 no existe -> se aborta (se protege la toolchain activa)"
            exit 1
          fi

          rm -rf prebuilts/rust/darwin-x86

          echo "=== PODA RUST DARWIN DESPUÉS ==="
          df -h /
          ls -d prebuilts/rust/darwin-x86 2>/dev/null \
            && echo "::error::la poda no eliminó por completo" \
            || echo "OK: prebuilts/rust/darwin-x86 eliminado"

      - name: Poda post-sync (prebuilts/rust/linux-x86 1.57.0/1.58.0/1.58.1)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RUST VERSIONES NO ACTIVAS ANTES ==="
          df -h /
          VERSIONS="prebuilts/rust/linux-x86/1.57.0 prebuilts/rust/linux-x86/1.58.0 prebuilts/rust/linux-x86/1.58.1"
          du -sh $VERSIONS 2>/dev/null || true

          # Verificar que la toolchain activa (RustDefaultVersion = 1.59.0) SÍ existe
          if [ ! -d "prebuilts/rust/linux-x86/1.59.0" ]; then
            echo "::error::prebuilts/rust/linux-x86/1.59.0 no existe -> se aborta (se protege la toolchain activa)"
            exit 1
          fi

          for V in $VERSIONS; do
            # Verificaciones de seguridad: debe existir como directorio
            if [ ! -d "$V" ]; then
              echo "::error::Directorio esperado no existe: $V -> se aborta la poda"
              exit 1
            fi

            # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
            PARENT="$(cd "$V" && pwd)"
            EXPECTED="$(pwd)/$V"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $V ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$V"

            ls -d "$V" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $V" \
              || echo "OK: $V eliminado"
          done

          echo "=== PODA RUST VERSIONES NO ACTIVAS DESPUÉS ==="
          df -h /

      - name: Poda post-sync (prebuilts/module_sdk/art snapshot inactivo @3)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA MODULE_SDK ART/3 ANTES ==="
          df -h /
          TARGET=prebuilts/module_sdk/art/3
          du -sh "$TARGET" 2>/dev/null || true

          # Verificar que el snapshot activo (@1) del proyecto module_sdk/art SÍ existe
          if [ ! -d "prebuilts/module_sdk/art/1" ]; then
            echo "::error::prebuilts/module_sdk/art/1 no existe -> se aborta (se protege el snapshot activo @1)"
            exit 1
          fi

          # Verificaciones de seguridad: debe existir como directorio
          if [ ! -d "$TARGET" ]; then
            echo "::error::Directorio esperado no existe: $TARGET -> se aborta la poda"
            exit 1
          fi

          # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
          PARENT="$(cd "$TARGET" && pwd)"
          EXPECTED="$(pwd)/$TARGET"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "::error::Resolución inesperada para $TARGET ($PARENT != $EXPECTED) -> abort"
            exit 1
          fi

          rm -rf "$TARGET"

          echo "=== PODA MODULE_SDK ART/3 DESPUÉS ==="
          df -h /
          ls -d "$TARGET" 2>/dev/null \
            && echo "::error::la poda no eliminó por completo" \
            || echo "OK: $TARGET eliminado"

      - name: Poda post-sync (prebuilts/android-emulator + remoteexecution-client)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA ANDROID-EMULATOR + REMOTEEXECUTION ANTES ==="
          df -h /
          du -sh prebuilts/android-emulator prebuilts/remoteexecution-client 2>/dev/null || true

          # Tolerante: el manifest j2lte-slim.xml ya puede haberlos excluido del
          # repo sync via <remove-project>. Si no existen, se informa y se
          # continúa (no abortar). Si existen, se podan.
          MISSING=0
          for d in android-emulator remoteexecution-client; do
            if [ ! -d "prebuilts/$d" ]; then
              echo "skip: prebuilts/$d no existe (ya excluido por j2lte-slim.xml en repo sync) -> nada que podar"
              MISSING=1
              continue
            fi
            PARENT="$(cd prebuilts/$d && pwd)"
            EXPECTED="$(pwd)/prebuilts/$d"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada prebuilts/$d ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi
          done

          if [ "$MISSING" = "1" ]; then
            echo "OK: sin poda post-sync necesaria (usa j2lte-slim.xml) -> continue"
          else
            rm -rf prebuilts/android-emulator prebuilts/remoteexecution-client
          fi

          echo "=== PODA ANDROID-EMULATOR + REMOTEEXECUTION DESPUÉS ==="
          df -h /
          for d in android-emulator remoteexecution-client; do
            ls -d prebuilts/$d 2>/dev/null \
              && echo "::error::la poda no eliminó $d" \
              || echo "OK: prebuilts/$d eliminado"
          done

      - name: Poda post-sync (prebuilts/runtime/mainline)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RUNTIME/MAINLINE ANTES ==="
          df -h /

          # Tolerante: si no existe (posible exclusión vía manifest), se informa y continúa.
          if [ ! -d "prebuilts/runtime/mainline" ]; then
            echo "skip: prebuilts/runtime/mainline no existe -> nada que podar"
            exit 0
          fi

          # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
          PARENT="$(cd prebuilts/runtime/mainline && pwd)"
          EXPECTED="$(pwd)/prebuilts/runtime/mainline"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "::error::Resolución inesperada para prebuilts/runtime/mainline ($PARENT != $EXPECTED) -> abort"
            exit 1
          fi

          rm -rf prebuilts/runtime/mainline

          echo "=== PODA RUNTIME/MAINLINE DESPUÉS ==="
          df -h /
          ls -d prebuilts/runtime/mainline 2>/dev/null \
            && echo "::error::la poda no eliminó por completo" \
            || echo "OK: prebuilts/runtime/mainline eliminado"

      - name: Poda post-sync (Ronda 2 6 candidatas test/docs/clang)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RONDA 2 ANTES ==="
          df -h /
          TARGETS="
            tools/dexter/testdata
            external/libabigail/tests
            prebuilts/clang/host/linux-x86/clang-stable
            prebuilts/clang/host/linux-x86/profiles
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA RONDA 2 DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (Tier 1: 9 candidatas SAFE)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA TIER 1 (9 SAFE) ANTES ==="
          df -h /
          TARGETS="
            external/jackson-databind/docs
            external/swiftshader/tests
            prebuilts/clang-tools/darwin-x86
            prebuilts/build-tools/linux_musl-x86
            external/tensorflow/tensorflow/compiler
            external/tensorflow/tensorflow/python
            external/tensorflow/tensorflow/lite/testing
            external/deqp/external/openglcts
            prebuilts/build-tools/darwin-x86
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA TIER 1 DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (autotest client+server)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA AUTOTEST ANTES ==="
          df -h /
          TARGETS="
            external/autotest/client
            external/autotest/server
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA AUTOTEST DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (sdk/32)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA SDK/32 ANTES ==="
          df -h /
          TARGETS="
            prebuilts/sdk/32
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          # prebuilts/sdk/32 es subdir sin .git (el proyecto es prebuilts/sdk);
          # cero sdk_version:"32" productivos en el árbol.
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA SDK/32 DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (extras profiling)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA EXTRAS ANTES ==="
          df -h /
          TARGETS="
            system/extras/ioshark
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          # Herramientas de profiling host sin consumidores en el grafo j2lte
          # (verificado: sin refs en system/frameworks/packages/cts/vendor).
          # NOTA: system/extras/simpleperf NO se poda (dependencias de
          # perf2cfg, profcollectd y cts-simpleperf en sus módulos).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA EXTRAS DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (Darwin arch remnants)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA DARWIN ANTES ==="
          df -h /
          TARGETS="
            prebuilts/jdk/jdk11/darwin-x86
            prebuilts/jdk/jdk11/darwin-arm64
            prebuilts/jdk/jdk8/darwin-x86
            prebuilts/build-tools/darwin-x86
            prebuilts/extract-tools/darwin-x86
            prebuilts/misc/darwin-x86
            prebuilts/misc/darwin-x86_64
          "
          du -sh $TARGETS 2>/dev/null || true

          # Binarios macOS inalcanzables en runner linux-x86_64: el build
          # selecciona prebuilts por HOST_OS/HOST_TAG (Soong HostPrebuiltTag
          # retorna "linux-x86" si runtime.GOOS=="linux"; make con ramas
          # ifeq ($(HOST_OS),darwin)). Barrido global sin referencias.
          # jdk11-linux, jdk8-linux, build-tools-linux, extract-linux y
          # misc-linux quedan INTACTOS (solo se listan darwin-*).
          # Protección: nunca eliminar un proyecto Git completo (contiene
          # .git); estos 7 son subdirs sin .git (padres con .git).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            case "$T" in
              prebuilts/jdk/jdk11/darwin-*|prebuilts/jdk/jdk8/darwin-*|prebuilts/build-tools/darwin-*|prebuilts/extract-tools/darwin-*|prebuilts/misc/darwin-*) ;;
              *) echo "::error::$T fuera de la allowlist Darwin -> se aborta"; exit 1 ;;
            esac

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA DARWIN DESPUÉS ==="
          df -h /

      # ============================================================
      # GUARD (después de TODAS las podas, igual que en stages)
      # ============================================================

      - name: GUARD espacio post-sync (FIX-014)
        run: |
          set -e
          AVAIL_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          MIN=${{ github.event.inputs.min_free_gb || 70 }}
          echo "Libres post-sync: ${AVAIL_GB}G (mínimo requerido para bacon: ${MIN}G)"
          if [ "${AVAIL_GB}" -lt "${MIN}" ]; then
            echo "::error::INFRASTRUCTURE-BLOCKED (FIX-014): ${AVAIL_GB}G libres < ${MIN}G requeridos para out/ + margen. No se ejecuta bacon."
            exit 90
          fi
          MODE='${{ github.event.inputs.mode }}'
          if [ "$MODE" != "full-bacon" ]; then
            echo "mode=lunch-only -> guard superado, se continúa solo hasta lunch."
          fi

      # ============================================================
      # BUILD CONFIG
      # ============================================================

      - name: source envsetup.sh + lunch lineage_j2lte-userdebug
        working-directory: /home/runner/los20
        run: |
          set -e
          source build/envsetup.sh
          lunch lineage_j2lte-userdebug
          echo "LUNCH_EXIT=$?"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Medición de disco ANTES del build
        if: ${{ github.event.inputs.mode == 'full-bacon' }}
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== DISCO ANTES DE mka bacon ==="
          df -h /
          du -sh out 2>/dev/null || true

      - name: Diagnóstico de almacenamiento fuera de out
        if: ${{ github.event.inputs.mode == 'full-bacon' }}
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "===== STORAGE DIAGNOSTIC: BEFORE BACON ====="
          df -h /
          echo "===== TOP-LEVEL DIRECTORIES ====="
          du -sh /tmp /var/tmp /home/runner/.cache /home/runner/* 2>/dev/null | sort -h
          echo "===== SYSTEM DIRECTORIES ====="
          du -sh /opt/* /usr/share/* /var/log/* 2>/dev/null | sort -h | tail -30
          echo "===== END STORAGE DIAGNOSTIC ====="

      - name: Inspección read-only de runner-cache y Gradle
        if: ${{ github.event.inputs.mode == 'full-bacon' }}
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== /opt/runner-cache ==="
          sudo du -sh /opt/runner-cache 2>/dev/null || true
          sudo ls -lah /opt/runner-cache 2>/dev/null || true
          sudo du -sh /opt/runner-cache/* 2>/dev/null | sort -h || true
          echo "=== /opt/actionarchivecache ==="
          sudo du -sh /opt/actionarchivecache 2>/dev/null || true
          sudo ls -lah /opt/actionarchivecache 2>/dev/null || true
          sudo du -sh /opt/actionarchivecache/* 2>/dev/null | sort -h || true
          echo "=== GRADLE EN PATH/WORKFLOW ==="
          command -v gradle || echo "gradle no está en PATH"
          ls -d /usr/share/gradle-9.7.1 2>/dev/null || echo "/usr/share/gradle-9.7.1 no existe"
          echo "=== KOTLINC (candidata registrada 94M, NO borrar) ==="
          du -sh /usr/share/kotlinc 2>/dev/null || true

      - name: mka bacon (build completo)
        id: build
        background: true
        if: ${{ github.event.inputs.mode == 'full-bacon' }}
        working-directory: /home/runner/los20
        run: |
          set -o pipefail

          # --- MONITOR DE DISCO (distinguir ENOSPC / kill externo / runner)
          #     traído de los20-build-stages.yml, adaptado a target único
          #     "bacon" (sin loop de $STAGE/$EXTRA). ---
          LOG=/tmp/disk-monitor.log
          : > "$LOG"
          TELEM_FREE_GB_MB=$(( (${TELEM_FREE_GB:-25}) * 1024 ))

          ninja_progress() {
            grep -aoE '\[ *[0-9]+% +[0-9]+/[0-9]+\]' /tmp/bacon.log 2>/dev/null \
              | tail -1 || true
          }

          dmesg_probe() {
            local out
            out=$(dmesg --ctime 2>/dev/null) || out="$(sudo -n dmesg --ctime 2>/dev/null)" || { echo "dmesg: no disponible"; return 0; }
            echo "$out" | grep -aiE 'out of memory|oom-kill|Killed process|hardware error|Call Trace|blk_update_request|I/O error' | tail -6
          }

          dmesg_tail() {
            local out
            out=$(dmesg --ctime 2>/dev/null) || out="$(sudo -n dmesg --ctime 2>/dev/null)" || { echo "dmesg: no disponible"; return 0; }
            echo "$out" | tail -40
          }

          state_cheap() {
            echo "ninja: $(ninja_progress)"
            df -h /
            df -i /
            echo "procs: clang=$(pgrep -c -f clang 2>/dev/null||echo 0) cc1plus=$(pgrep -c cc1plus 2>/dev/null||echo 0) ninja=$(pgrep -c ninja 2>/dev/null||echo 0)"
            grep -E 'Mem:|Swap:' /proc/meminfo
          }

          monitor_normal() {
            echo "=== $(date -u +%FT%T) [NORMAL 5min] ==="
            state_cheap
            du -sb -- out out/soong/.intermediates out/target/common/obj \
              out/target/product/j2lte/obj out/target/product/j2lte/symbols \
              2>/dev/null
            echo "--- top dirs out/ ---"
            du -sh out/* 2>/dev/null | sort -h | tail -20
            echo "--- archivos que crecieron en los últimos 5 min ---"
            find out -newermt '5 minutes ago' -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -15
          }

          monitor_dense() {
            echo "=== $(date -u +%FT%T) [DENSOS 5s] ==="
            state_cheap
            timeout 30 du -sh out 2>/dev/null
            timeout 30 du -sh out/soong 2>/dev/null
            timeout 30 du -sh out/host 2>/dev/null
            timeout 30 du -sh out/target 2>/dev/null
            timeout 30 du -sh out/soong/.intermediates/external/webrtc 2>/dev/null || true
            echo "--- dmesg ---"
            dmesg_probe
          }

          last_gasp() {
            echo "### BAJISMO free -> volcado final ###"
            df -h /
            df -i /
            free -m
            echo "ninja: $(ninja_progress)"
            ps -eo pid,ppid,stat,etime,args --sort=-%cpu | head -30
            pgrep -af 'clang|cc1plus|ninja|mka' || true
            echo "uptime: $(uptime)"
            dmesg_tail
          }

          (
            set +e
            while :; do
              free_mb=$(df -B1 / | awk 'NR==2{print $4/1048576}')
              if [ "${free_mb%.*}" -lt "$TELEM_FREE_GB_MB" ]; then
                echo "### UMBRAL ${TELEM_FREE_GB:-25}GB free=${free_mb}MB -> muestreo denso cada 5s ###" | tee -a "$LOG"
                while :; do
                  monitor_dense | tee -a "$LOG"
                  f2=$(df -B1 / | awk 'NR==2{print $4/1048576}')
                  if [ "${f2%.*}" -lt 100 ]; then
                    last_gasp | tee -a "$LOG" 2>&1
                    # Emergency checkpoint: marcar UNA sola vez para que el
                    # guardia dispare el upload sin detener mka (umbral 100MB).
                    if [ ! -e /tmp/EMERGENCY ]; then
                      touch /tmp/EMERGENCY 2>/dev/null || true
                    fi
                    break
                  fi
                  sleep 5
                done
              else
                monitor_normal | tee -a "$LOG"
                sleep 300
              fi
            done
          ) &
          MON_PID=$!
          trap 'touch /tmp/BUILD_DONE 2>/dev/null || true; kill "$MON_PID" 2>/dev/null; wait "$MON_PID" 2>/dev/null || true; cat "$LOG" >&2' EXIT
          # --- FIN MONITOR ---

          export WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=true

          echo "=== WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=$WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY ==="

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug >/dev/null

          echo "== mka bacon =="

          time mka --skip-soong-tests bacon -j"$(nproc)" 2>&1 | tee /tmp/bacon.log
          RC=${PIPESTATUS[0]}
          echo "BACON_RC=$RC"
          exit "$RC"

      - name: Guardia emergency checkpoint
        id: guardia
        if: ${{ github.event.inputs.mode == 'full-bacon' }}
        run: |
          set +e
          # Espera flag de emergencia o fin del build (con deadline propio para
          # no colgar el job). Solo prepara snapshots si hubo emergencia.
          EMERG=/tmp/EMERGENCY
          DONE=/tmp/BUILD_DONE
          OUT="$GITHUB_WORKSPACE/artifacts-emergency"
          END=$(( $(date +%s) + 19800 ))
          while [ ! -e "$EMERG" ] && [ ! -e "$DONE" ] && [ $(date +%s) -lt $END ]; do
            sleep 30
          done
          if [ -e "$EMERG" ]; then
            mkdir -p "$OUT" 2>/dev/null || true
            df -h / > "$OUT/df-final.txt" 2>&1 || true
            du -sh /home/runner/los20/out 2>/dev/null > "$OUT/du-final.txt" || true
            gzip -c /tmp/disk-monitor.log > "$OUT/disk-monitor.log.gz" 2>/dev/null || true
            gzip -c /tmp/bacon.log > "$OUT/bacon.log.gz" 2>/dev/null || true
            echo "emergency=true" >> "$GITHUB_OUTPUT"
          else
            echo "emergency=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload emergency checkpoint
        if: steps.guardia.outputs.emergency == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emergency-telemetry-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts-emergency/
          if-no-files-found: warn
          retention-days: 3

      - name: Wait build
        if: ${{ github.event.inputs.mode == 'full-bacon' }}
        wait: [build]

      - name: Rescate de telemetría ante fallo/ENOSPC/kill
        if: always()
        run: |
          set +e
          echo "=== RESCATE TELEMETRÍA ==="
          df -h / 2>&1
          df -i / 2>&1
          free -m 2>&1

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for f in /tmp/bacon.log /tmp/disk-monitor.log; do
            if [ -f "$f" ]; then
              gzip -c "$f" > "$GITHUB_WORKSPACE/artifacts/$(basename "$f").gz" 2>/dev/null \
                || cp "$f" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null
            fi
          done

          ps -eo pid,ppid,stat,etime,comm,args --sort=-%mem | head -30 \
            > "$GITHUB_WORKSPACE/artifacts/ps-final.txt" 2>&1

          pgrep -af 'clang|cc1plus|ninja|mka' > "$GITHUB_WORKSPACE/artifacts/procs-final.txt" 2>&1 || true
          echo "uptime: $(uptime)" >> "$GITHUB_WORKSPACE/artifacts/procs-final.txt"

          if ! dmesg --ctime 2>/dev/null | tail -40 > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"; then
            if ! sudo -n dmesg --ctime 2>/dev/null | tail -40 > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"; then
              echo "dmesg: no disponible" > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"
            fi
          fi

          echo "--- contenido de artifacts/ ---"
          ls -la "$GITHUB_WORKSPACE/artifacts/" 2>&1

      - name: Medición de disco DESPUÉS del build
        if: always()
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== DISCO DESPUÉS DEL BUILD ==="
          df -h /
          du -sh out 2>/dev/null || true
          echo "=== Directorios más grandes en out/ ==="
          du -sh out/* 2>/dev/null | sort -h | tail -20 || true

      # ============================================================
      # RESULTADOS
      # ============================================================

      - name: Resumen y artefactos
        if: always()
        working-directory: /home/runner/los20
        run: |
          df -h /
          echo "=== out/target (si existe) ==="
          ls -la out/target/product/* 2>/dev/null || echo "(sin productos)"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          if compgen -G "out/target/product/*/*.zip" > /dev/null; then
            cp out/target/product/*/*.zip "$GITHUB_WORKSPACE/artifacts/" || true
          fi
          cp /tmp/bacon.log "$GITHUB_WORKSPACE/artifacts/bacon.log" 2>/dev/null || true

      - name: Upload target files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j2lte-target-files-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
