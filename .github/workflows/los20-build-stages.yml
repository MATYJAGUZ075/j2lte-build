      - name: Configurar lunch
        working-directory: /home/runner/los20
        run: |
          set -e

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug

      - name: Resolver target
        working-directory: /home/runner/los20
        run: |
          set -e

          case "$STAGE" in
            systemimage-guard)
              TARGET="systemimage"
              ;;
            bootimage)
              TARGET="bootimage"
              ;;
            recoveryimage)
              TARGET="recoveryimage"
              ;;
            *)
              echo "::error::Stage inválido: $STAGE"
              exit 64
              ;;
          esac

          echo "REQUESTED_STAGE=$STAGE"
          echo "RESOLVED_TARGET=$TARGET"

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      # ============================================================
      # GUARD
      # ============================================================

      - name: Guard de espacio para systemimage
        if: ${{ github.event.inputs.stage == 'systemimage-guard' }}
        run: |
          set -e

          AVAIL_GB=$(
            df --output=avail -BG / |
            tail -1 |
            tr -dc '0-9'
          )

          MIN="${MIN_FREE_GB:-40}"

          echo "Espacio libre: ${AVAIL_GB}G"
          echo "Mínimo requerido: ${MIN}G"

          if [ "$AVAIL_GB" -lt "$MIN" ]; then
            echo "::error::No hay espacio suficiente para systemimage."
            echo "::error::Libres: ${AVAIL_GB}G / requeridos: ${MIN}G"
            exit 90
          fi

      # ============================================================
      # BUILD
      # ============================================================

      - name: Medición de disco ANTES del build
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== DISCO ANTES DE mka $STAGE ==="
          df -h /
          du -sh out 2>/dev/null || true
          echo "=== Directorios más grandes en out/ ==="
          du -sh out/* 2>/dev/null | sort -h | tail -20 || true

      - name: Diagnóstico de almacenamiento fuera de out
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "===== STORAGE DIAGNOSTIC: BEFORE SYSTEMIMAGE ====="
          df -h /
          echo "===== TOP-LEVEL DIRECTORIES ====="
          du -sh /tmp /var/tmp /home/runner/.cache /home/runner/* 2>/dev/null | sort -h
          echo "===== SYSTEM DIRECTORIES ====="
          du -sh /opt/* /usr/share/* /var/log/* 2>/dev/null | sort -h | tail -30
          echo "===== END STORAGE DIAGNOSTIC ====="

      - name: Inspección read-only de runner-cache y Gradle
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== /opt/runner-cache ==="
          sudo du -sh /opt/runner-cache 2>/dev/null || true
          sudo ls -lah /opt/runner-cache 2>/dev/null || true
          sudo du -sh /opt/runner-cache/* 2>/dev/null | sort -h || true
          echo "=== /opt/actionarchivecache ==="
          sudo du -sh /opt/actionarchivecache 2>/dev/null || true
          sudo ls -lah /opt/actionarchivecache 2>/dev/null || true
          sudo du -sh /opt/actionarchivecache/* 2>/dev/null | sort -h || true
          echo "=== GRADLE EN PATH/WORKFLOW ==="
          command -v gradle || echo "gradle no está en PATH"
          ls -d /usr/share/gradle-9.7.1 2>/dev/null || echo "/usr/share/gradle-9.7.1 no existe"
          echo "=== KOTLINC (candidata registrada 94M, NO borrar) ==="
          du -sh /usr/share/kotlinc 2>/dev/null || true

      - name: Build targets
        id: build
        background: true
        working-directory: /home/runner/los20
        run: |
          set -o pipefail

          # --- MONITOR DE DISCO (distinguir ENOSPC / kill externo / runner) ---
          LOG=/tmp/disk-monitor.log
          : > "$LOG"
          TELEM_FREE_GB_MB=$(( (${TELEM_FREE_GB:-25}) * 1024 ))

          ninja_progress() {
            grep -aoE '\[ *[0-9]+% +[0-9]+/[0-9]+\]' /tmp/stage.log 2>/dev/null \
              | tail -1 || true
          }

          dmesg_probe() {
            local out
            out=$(dmesg --ctime 2>/dev/null) || out="$(sudo -n dmesg --ctime 2>/dev/null)" || { echo "dmesg: no disponible"; return 0; }
            echo "$out" | grep -aiE 'out of memory|oom-kill|Killed process|hardware error|Call Trace|blk_update_request|I/O error' | tail -6
          }

          dmesg_tail() {
            local out
            out=$(dmesg --ctime 2>/dev/null) || out="$(sudo -n dmesg --ctime 2>/dev/null)" || { echo "dmesg: no disponible"; return 0; }
            echo "$out" | tail -40
          }

          state_cheap() {
            echo "ninja: $(ninja_progress)"
            df -h /
            df -i /
            echo "procs: clang=$(pgrep -c -f clang 2>/dev/null||echo 0) cc1plus=$(pgrep -c cc1plus 2>/dev/null||echo 0) ninja=$(pgrep -c ninja 2>/dev/null||echo 0)"
            grep -E 'Mem:|Swap:' /proc/meminfo
          }

          monitor_normal() {
            echo "=== $(date -u +%FT%T) [NORMAL 5min] ==="
            state_cheap
            du -sb -- out out/soong/.intermediates out/target/common/obj \
              out/target/product/j2lte/obj out/target/product/j2lte/symbols \
              2>/dev/null
            echo "--- top dirs out/ ---"
            du -sh out/* 2>/dev/null | sort -h | tail -20
            echo "--- archivos que crecieron en los últimos 5 min ---"
            find out -newermt '5 minutes ago' -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -15
          }

          monitor_dense() {
            echo "=== $(date -u +%FT%T) [DENSOS 5s] ==="
            state_cheap
            timeout 30 du -sh out 2>/dev/null
            timeout 30 du -sh out/soong 2>/dev/null
            timeout 30 du -sh out/host 2>/dev/null
            timeout 30 du -sh out/target 2>/dev/null
            timeout 30 du -sh out/soong/.intermediates/external/webrtc 2>/dev/null || true
            echo "--- dmesg ---"
            dmesg_probe
          }

          last_gasp() {
            echo "### BAJISMO free -> volcado final ###"
            df -h /
            df -i /
            free -m
            echo "ninja: $(ninja_progress)"
            ps -eo pid,ppid,stat,etime,args --sort=-%cpu | head -30
            pgrep -af 'clang|cc1plus|ninja|mka' || true
            echo "uptime: $(uptime)"
            dmesg_tail
          }

          (
            set +e
            while :; do
              free_mb=$(df -B1 / | awk 'NR==2{print $4/1048576}')
              if [ "${free_mb%.*}" -lt "$TELEM_FREE_GB_MB" ]; then
                echo "### UMBRAL ${TELEM_FREE_GB:-25}GB free=${free_mb}MB -> muestreo denso cada 5s ###" | tee -a "$LOG"
                while :; do
                  monitor_dense | tee -a "$LOG"
                  f2=$(df -B1 / | awk 'NR==2{print $4/1048576}')
                  if [ "${f2%.*}" -lt 100 ]; then
                    last_gasp | tee -a "$LOG" 2>&1
                    # Emergency checkpoint: marcar UNA sola vez para que el
                    # guardia dispare el upload sin detener mka (umbral 100MB).
                    if [ ! -e /tmp/EMERGENCY ]; then
                      touch /tmp/EMERGENCY 2>/dev/null || true
                    fi
                    break
                  fi
                  sleep 5
                done
              else
                monitor_normal | tee -a "$LOG"
                sleep 300
              fi
            done
          ) &
          MON_PID=$!
          trap 'touch /tmp/BUILD_DONE 2>/dev/null || true; kill "$MON_PID" 2>/dev/null; wait "$MON_PID" 2>/dev/null || true; cat "$LOG" >&2' EXIT
          # --- FIN MONITOR ---

          export WITH_DEXPREOPT=false

          echo "=== WITH_DEXPREOPT=$WITH_DEXPREOPT ==="

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug >/dev/null

          ALL_TARGETS="$TARGET"

          if [ -n "$EXTRA" ]; then
            OLD_IFS="$IFS"
            IFS=','

            for extra in $EXTRA; do
              case "$extra" in
                bootimage|recoveryimage)
                  ;;
                *)
                  echo "::error::Target extra inválido: $extra"
                  exit 66
                  ;;
              esac
            done

            IFS="$OLD_IFS"
            ALL_TARGETS="$ALL_TARGETS,$EXTRA"
          fi

          echo "SECUENCIA=$ALL_TARGETS"

          OLD_IFS="$IFS"
          IFS=','

          for target in $ALL_TARGETS; do
            case "$target" in
              bootimage|recoveryimage|systemimage)
                ;;
              *)
                echo "::error::Target no permitido: $target"
                exit 66
                ;;
            esac

            echo "== mka $target =="

            time mka --skip-soong-tests "$target" -j"$(nproc)" \
              2>&1 | tee /tmp/stage.log

            RC=${PIPESTATUS[0]}

            if [ "$RC" -ne 0 ]; then
              echo "STAGE_EXIT=$RC ($target)"
              exit "$RC"
            fi

            echo "OK: $target"
            df -h /
          done

          IFS="$OLD_IFS"

      - name: Guardia emergency checkpoint
        id: guardia
        run: |
          set +e
          # Espera flag de emergencia o fin del build (con deadline propio para
          # no colgar el job). Solo prepara snapshots si hubo emergencia.
          EMERG=/tmp/EMERGENCY
          DONE=/tmp/BUILD_DONE
          OUT="$GITHUB_WORKSPACE/artifacts-emergency"
          END=$(( $(date +%s) + 19800 ))
          while [ ! -e "$EMERG" ] && [ ! -e "$DONE" ] && [ $(date +%s) -lt $END ]; do
            sleep 30
          done
          if [ -e "$EMERG" ]; then
            mkdir -p "$OUT" 2>/dev/null || true
            df -h / > "$OUT/df-final.txt" 2>&1 || true
            du -sh /home/runner/los20/out 2>/dev/null > "$OUT/du-final.txt" || true
            gzip -c /tmp/disk-monitor.log > "$OUT/disk-monitor.log.gz" 2>/dev/null || true
            gzip -c /tmp/stage.log > "$OUT/stage.log.gz" 2>/dev/null || true
            echo "emergency=true" >> "$GITHUB_OUTPUT"
          else
            echo "emergency=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload emergency checkpoint
        if: steps.guardia.outputs.emergency == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emergency-telemetry-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts-emergency/
          if-no-files-found: warn
          retention-days: 3

      - name: Wait build
        wait: [build]

      - name: Rescate de telemetría ante fallo/ENOSPC/kill
        if: always()
        run: |
          set +e
          echo "=== RESCATE TELEMETRÍA ==="
          df -h / 2>&1
          df -i / 2>&1
          free -m 2>&1

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          for f in /tmp/stage.log /tmp/disk-monitor.log; do
            if [ -f "$f" ]; then
              gzip -c "$f" > "$GITHUB_WORKSPACE/artifacts/$(basename "$f").gz" 2>/dev/null \
                || cp "$f" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null
            fi
          done

          ps -eo pid,ppid,stat,etime,comm,args --sort=-%mem | head -30 \
            > "$GITHUB_WORKSPACE/artifacts/ps-final.txt" 2>&1

          pgrep -af 'clang|cc1plus|ninja|mka' > "$GITHUB_WORKSPACE/artifacts/procs-final.txt" 2>&1 || true
          echo "uptime: $(uptime)" >> "$GITHUB_WORKSPACE/artifacts/procs-final.txt"

          if ! dmesg --ctime 2>/dev/null | tail -40 > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"; then
            if ! sudo -n dmesg --ctime 2>/dev/null | tail -40 > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"; then
              echo "dmesg: no disponible" > "$GITHUB_WORKSPACE/artifacts/dmesg-final.txt"
            fi
          fi

          echo "--- contenido de artifacts/ ---"
          ls -la "$GITHUB_WORKSPACE/artifacts/" 2>&1

      # ============================================================
      # RESULTADOS
      # ============================================================

      - name: Medición de disco DESPUÉS del build
        if: always()
        working-directory: /home/runner/los20
        run: |
          set +e
          echo "=== DISCO DESPUÉS DEL BUILD ==="
          df -h /
          du -sh out 2>/dev/null || true
          echo "=== Directorios más grandes en out/ ==="
          du -sh out/* 2>/dev/null | sort -h | tail -20 || true

      - name: Recopilar artefactos
        if: always()
        working-directory: /home/runner/los20
        run: |
          set +e

          df -h /
          du -sm out 2>/dev/null || true

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          PRODUCT=out/target/product/j2lte

          cp "$PRODUCT/boot.img" \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          cp "$PRODUCT/recovery.img" \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          cp "$PRODUCT/system.img" \
            "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true

          cp /tmp/stage.log \
            "$GITHUB_WORKSPACE/artifacts/stage.log" 2>/dev/null || true

          cp /tmp/disk-monitor.log \
            "$GITHUB_WORKSPACE/artifacts/disk-monitor.log" 2>/dev/null || true

      - name: Upload artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ github.event.inputs.stage }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
