# iOS J2 Port - XNU 4570 ARMv7 Build
# Samsung Galaxy J2 SM-J200M / Exynos 3475
# Independent workflow

name: "iOS J2 Port - XNU 4570 ARMv7 Build"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xnu-armv7-build:
    name: Build XNU 4570 ARMv7 J2
    runs-on: macos-14
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:

      # --------------------------------------------------
      # 1. Checkout J2 project
      # --------------------------------------------------

      - name: Checkout j2lte-build
        uses: actions/checkout@v4
        with:
          ref: experiment/ios-port
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Download original Apple XNU
      # --------------------------------------------------

      - name: Checkout XNU 4570.71.2
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: xnu-4570.71.2
          path: ios-port/xnu-4570.71.2-source
          fetch-depth: 1

      # --------------------------------------------------
      # 3. Validate and apply J2 modifications
      # --------------------------------------------------

      - name: Apply J2 patches to XNU
        run: |
          set -euo pipefail

          SOURCE="ios-port/xnu-4570.71.2"
          TARGET="ios-port/xnu-4570.71.2-source"

          echo "Checking J2 source files..."

          FILES=(
            "pexpert/pexpert/arm/J2.h"
            "pexpert/pexpert/arm/board_config.h"
            "config/MASTER.arm"
            "makedefs/MakeInc.def"
            "makedefs/MakeInc.top"
          )

          for FILE in "${FILES[@]}"; do
            if [ ! -f "${SOURCE}/${FILE}" ]; then
              echo "ERROR: Missing J2 file: ${SOURCE}/${FILE}"
              exit 1
            fi

            if [ ! -d "${TARGET}/$(dirname "${FILE}")" ]; then
              echo "ERROR: Missing XNU directory for ${FILE}"
              exit 1
            fi

            cp "${SOURCE}/${FILE}" "${TARGET}/${FILE}"
            echo "Applied: ${FILE}"
          done

          echo "All J2 files copied successfully."

      # --------------------------------------------------
      # 4. Check Apple build environment
      # --------------------------------------------------

      - name: Show Xcode and SDK versions
        run: |
          set -euo pipefail

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

          echo "=== Apple tools ==="
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find ld
          xcrun --sdk iphoneos --find mig

          echo "=== Python ==="
          python3 --version

      # --------------------------------------------------
      # 5. Prepare isolated temporary build directories
      # --------------------------------------------------

      - name: Setup XNU build directories
        run: |
          set -euo pipefail

          BUILD_DIR="${RUNNER_TEMP}/xnu-j2-build-${GITHUB_RUN_ID}"

          mkdir -p \
            "${BUILD_DIR}/obj" \
            "${BUILD_DIR}/dst" \
            "${BUILD_DIR}/sym"

          {
            echo "BUILD_DIR=${BUILD_DIR}"
            echo "OBJROOT=${BUILD_DIR}/obj"
            echo "DSTROOT=${BUILD_DIR}/dst"
            echo "SYMROOT=${BUILD_DIR}/sym"
            echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)"
          } >> "${GITHUB_ENV}"

          echo "Build directory: ${BUILD_DIR}"
          echo "LineageOS cache will not be accessed."

      # --------------------------------------------------
      # 6. Update Python shebangs
      # --------------------------------------------------

      - name: Fix Python shebangs in XNU
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -euo pipefail

          find . -name "*.py" -type f -exec \
            sed -i '' \
            '1s|^#!/usr/bin/python$|#!/usr/bin/env python3|' {} \;

          echo "Python shebang update completed."

      # --------------------------------------------------
      # 7. Normalize Python indentation safely
      # --------------------------------------------------

      - name: Fix makekdebugevents.py
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -euo pipefail

          FILE="bsd/kern/makekdebugevents.py"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} not found."
            exit 1
          fi

          echo "Normalizing tabs without reconstructing indentation..."

          TEMP_FILE="${RUNNER_TEMP}/makekdebugevents.py"

          expand -t 8 "${FILE}" > "${TEMP_FILE}"
          cp "${TEMP_FILE}" "${FILE}"

          chmod +x "${FILE}"

          echo "Checking Python syntax..."

          python3 -m py_compile "${FILE}"

          echo "Python syntax check passed."

      # --------------------------------------------------
      # 8. Build XNU ARMv7 J2
      # --------------------------------------------------

      - name: Build XNU 4570 ARMv7 J2
        id: build
        working-directory: ios-port/xnu-4570.71.2-source
        env:
          OBJROOT: ${{ env.OBJROOT }}
          DSTROOT: ${{ env.DSTROOT }}
          SYMROOT: ${{ env.SYMROOT }}
          SDKROOT: ${{ env.SDKROOT }}
          BUILD_DIR: ${{ env.BUILD_DIR }}

        run: |
          set -uo pipefail

          echo "===================================="
          echo "XNU 4570.71.2 - J2 ARMv7 BUILD"
          echo "===================================="

          echo "Architecture: ARMv7"
          echo "Machine: Exynos 3475"
          echo "Board: Samsung SM-J200M"
          echo "SDK: ${SDKROOT}"

          set +e

          make \
            TARGET_CONFIGS="RELEASE ARM J2" \
            ARCH_CONFIGS=ARM \
            MACHINE_CONFIGS=J2 \
            KERNEL_CONFIGS=RELEASE \
            PLATFORM=iPhoneOS \
            SDKROOT="${SDKROOT}" \
            BUILD_LTO=0 \
            BUILD_DSYM=0 \
            BUILD_WERROR=0 \
            CTFCONVERT=/usr/bin/true \
            CTFMERGE=/usr/bin/true \
            CTFINSERT=/usr/bin/true \
            EMBEDDED_DEVICE_MAP=/dev/null \
            OBJROOT="${OBJROOT}" \
            DSTROOT="${DSTROOT}" \
            SYMROOT="${SYMROOT}" \
            all 2>&1 | tee "${BUILD_DIR}/build.log"

          BUILD_RESULT=$?

          echo "exit_code=${BUILD_RESULT}" >> "${GITHUB_OUTPUT}"

          echo "XNU build exit code: ${BUILD_RESULT}"

          exit "${BUILD_RESULT}"

      # --------------------------------------------------
      # 9. Check actual build result and artifacts
      # --------------------------------------------------

      - name: Check build result
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outputs.exit_code }}
          OBJROOT: ${{ env.OBJROOT }}
          SYMROOT: ${{ env.SYMROOT }}
          BUILD_DIR: ${{ env.BUILD_DIR }}

        run: |
          set -u

          echo "===================================="
          echo "BUILD RESULT"
          echo "===================================="

          if [ -z "${BUILD_RESULT}" ]; then
            BUILD_RESULT=1
          fi

          echo "Exit code: ${BUILD_RESULT}"

          echo "=== Searching kernel artifacts ==="

          find "${OBJROOT}" "${SYMROOT}" \
            -type f \
            \( -name 'mach*' -o -name 'kernel*' \) \
            -print 2>/dev/null | head -50 || true

          if [ "${BUILD_RESULT}" -ne 0 ]; then
            echo "=== BUILD FAILED ==="

            if [ -f "${BUILD_DIR}/build.log" ]; then
              tail -200 "${BUILD_DIR}/build.log"
            fi

            exit 1
          fi

          echo "=== BUILD COMMAND COMPLETED SUCCESSFULLY ==="

      # --------------------------------------------------
      # 10. Upload complete build log
      # --------------------------------------------------

      - name: Upload XNU build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-build-log
          path: ${{ env.BUILD_DIR }}/build.log
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 11. Upload possible kernel artifacts
      # --------------------------------------------------

      - name: Upload XNU kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-kernel
          path: |
            ${{ env.OBJROOT }}/**/mach*
            ${{ env.SYMROOT }}/**/mach*
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 12. Final GitHub Actions summary
      # --------------------------------------------------

      - name: Build summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outputs.exit_code }}

        run: |
          if [ -z "${BUILD_RESULT}" ]; then
            BUILD_RESULT=1
          fi

          if [ "${BUILD_RESULT}" -eq 0 ]; then
            {
              echo "## XNU build command completed"
              echo ""
              echo "The make command returned exit code 0."
              echo ""
              echo "Check uploaded artifacts to verify kernel output."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## XNU build failed"
              echo ""
              echo "Exit code: ${BUILD_RESULT}"
              echo ""
              echo "Download xnu-j2-build-log for diagnostics."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
```
