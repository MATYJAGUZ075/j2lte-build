# los20-build-stages.yml
# LineageOS 20 - Samsung J2 / j2lte
#
# FIX-028: kernel genera zImage-dtb con DTB incorporado.
# FIX-029: adaptación Clang del kernel 3.10.
#
# Estrategia:
# repo sync → liberar espacio opcional → lunch → guard → build

name: LOS20 build stages

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Target principal'
        required: true
        default: 'systemimage-guard'
        type: choice
        options:
          - systemimage-guard
          - bootimage
          - recoveryimage

      min_free_gb:
        description: 'GB libres mínimos para systemimage'
        required: false
        default: '40'

      telemetry_free_gb:
        description: 'GB libres que activan telemetría densa de diagnóstico (solo lectura)'
        required: false
        default: '25'

      extra_targets:
        description: 'Targets extra secuenciales: bootimage,recoveryimage'
        required: false
        default: ''

      probe_mnt:
        description: 'Solo inspeccionar /mnt, sin build'
        required: false
        default: false
        type: boolean

      kernel_toolchain:
        description: 'Toolchain del kernel (experimento A/B): clang (CI actual) o gcc (TARGET_KERNEL_CLANG_COMPILE=false)'
        required: false
        default: 'clang'
        type: choice
        options:
          - clang
          - gcc

      pstore_diag:
        description: 'Diagnóstico: inyecta pstore/ramoops + ram console al defconfig del kernel (boot colgado se captura en RAM y sobrevive warm reboot)'
        required: false
        default: false
        type: boolean

concurrency:
  group: los20-stages
  cancel-in-progress: false

jobs:
  probe-mnt:
    if: inputs.probe_mnt == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspección /mnt (solo lectura)
        run: |
          set +e
          echo "=== df -h / ==="; df -h /
          echo "=== df -h /mnt ==="; df -h /mnt
          echo "=== findmnt ==="; findmnt -D -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL || true
          echo "=== lsblk ==="; lsblk -d -o NAME,SIZE,TYPE || true
          echo "=== ls -la /mnt ==="; ls -la /mnt || true
          echo "=== swapon/free ==="; swapon -s || true; free -h || true

  stage-build:
    if: inputs.probe_mnt != true
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      # ccache ELIMINADO por completo (run prueba sin cache: recuperar ~1G de
      # runner y medir impacto en tiempo total). NO re-agregar USE_CCACHE,
      # CCACHE_EXEC, CCACHE_DIR, restore/save de actions/cache, instalación
      # del binario, ni stats/mediciones de ccache sin autorización explícita.
      # Salta la generación de ABI dumps (.sdump/.lsdump) que systemimage no
      # necesita (solo los usa el goal debug findlsdumps). Reduce el pico de
      # out/soong. Leído por Soong vía IsEnvTrue en cc/sabi.go.
      SKIP_ABI_CHECKS: "true"
      STAGE: ${{ github.event.inputs.stage }}
      MIN_FREE_GB: ${{ github.event.inputs.min_free_gb }}
      EXTRA: ${{ github.event.inputs.extra_targets }}
      TELEM_FREE_GB: ${{ github.event.inputs.telemetry_free_gb }}
      # ATENCIÓN: el nombre NO puede ser KERNEL_TOOLCHAIN. make importa las
      # variables de entorno y BoardConfigKernel.mk:129 la usa con `?=`:
      # un valor no vacío del entorno (p.ej. "clang") NO se sobreescribe y
      # CROSS_COMPILE queda como "clang/arm-linux-androidkernel-" -> Error 127.
      AB_KERNEL_TC: ${{ github.event.inputs.kernel_toolchain }}

    steps:

      # ============================================================
      # RUNNER
      # ============================================================

      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Liberar espacio del runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Limpieza controlada de Swift preinstalado
        run: |
          set -e
          echo "=== SWIFT PRE-INSTALL ANTES ==="
          df -h /
          if [ ! -d /usr/share/swift ]; then
            echo "skip: /usr/share/swift no existe -> nada que limpiar"
            exit 0
          fi
          du -sh /usr/share/swift
          sudo rm -rf -- /usr/share/swift
          if [ -e /usr/share/swift ]; then
            echo "::error::no se pudo eliminar /usr/share/swift"
            exit 1
          fi
          echo "OK: /usr/share/swift eliminado"
          echo "=== TOOLCHAINS ADICIONALES (miniconda/pipx/az/microsoft) ==="
          for T in /usr/share/miniconda /opt/pipx /usr/share/az_15.6.1 /opt/microsoft; do
            if [ ! -e "$T" ]; then
              echo "skip: $T no existe -> nada que limpiar"
              continue
            fi
            du -sh "$T"
            sudo rm -rf -- "$T"
            if [ -e "$T" ]; then
              echo "::error::no se pudo eliminar $T"
              exit 1
            fi
            echo "OK: $T eliminado"
          done
          echo "=== SWIFT PRE-INSTALL DESPUÉS ==="
          df -h /

      - name: Limpieza controlada off-out (kotlinc/gradle/runner-2.336.0/actions no usadas)
        run: |
          set -e
          echo "=== OFF-OUT EXTRA ANTES ==="
          df -h /
          # Candidatos verificados como seguros (auditoría read-only):
          # kotlinc 94M (build usa external/kotlinc), gradle 165M (sin uso),
          # archivos 2.336.0 (agente en uso es 2.337.0, updates esperan fin
          # del job), paquetes de actions no usadas por este workflow.
          for T in \
            /usr/share/kotlinc \
            /usr/share/gradle-9.7.1 \
            /opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.gz \
            /opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.zst \
            /opt/actionarchivecache/actions_setup-node \
            /opt/actionarchivecache/actions_setup-python \
            /opt/actionarchivecache/github_codeql-action \
            /opt/actionarchivecache/github_gh-aw-actions; do
            # Allowlist estática: SOLO estas 8 rutas exactas pueden borrarse.
            # (No se verifica existencia de rutas protegidas aquí porque en
            # esta fase los20 aún no existe: lo crea repo init después.
            # Run 34792065347 demostró que exigir su existencia aborta el job.)
            case "$T" in
              /usr/share/kotlinc|/usr/share/gradle-9.7.1|/opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.gz|/opt/runner-cache/actions-runner-linux-x64-2.336.0.tar.zst|/opt/actionarchivecache/actions_setup-node|/opt/actionarchivecache/actions_setup-python|/opt/actionarchivecache/github_codeql-action|/opt/actionarchivecache/github_gh-aw-actions)
                ;;
              *)
                echo "::error::ruta no autorizada: $T"
                exit 1
                ;;
            esac
            if [ ! -e "$T" ]; then
              echo "skip: $T no existe -> nada que limpiar"
              continue
            fi
            du -sh "$T"
            sudo rm -rf -- "$T"
            if [ -e "$T" ]; then
              echo "::error::no se pudo eliminar $T"
              exit 1
            fi
            echo "OK: $T eliminado"
          done
          echo "=== OFF-OUT EXTRA DESPUÉS ==="
          df -h /

      - name: Disco antes
        run: df -h /

      # ============================================================
      # Storage diag
      # ============================================================

      - name: Diagnosticar almacenamiento
        run: |
          echo "=== DF ==="
          df -h

          echo
          echo "=== LSBLK ==="
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS

          echo
          echo "=== FINDMNT ==="
          findmnt

          echo
          echo "=== /mnt ==="
          ls -lah /mnt 2>/dev/null || true
          df -h /mnt 2>/dev/null || true

      # ============================================================
      # DEPENDENCIAS (ccache eliminado: ver env)
      # ============================================================

      - name: Instalar dependencias
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y git-lfs python3 curl

          mkdir -p "$HOME/bin"

          curl -s \
            https://storage.googleapis.com/git-repo-downloads/repo \
            > "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "j2lte-ci"
          git config --global user.email "j2lte-ci@users.noreply.github.com"

          git lfs install

          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libncurses.so.6 \
            /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true

          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libtinfo.so.6 \
            /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

          sudo apt-get install -y libc++1 >/dev/null 2>&1 || \
            sudo ln -sf \
              /usr/lib/x86_64-linux-gnu/libc++.so.1 \
              /usr/lib/x86_64-linux-gnu/libc++.so || true

      # ============================================================
      # SOURCE
      # ============================================================

      - name: repo init
        run: |
          set -e

          mkdir -p "$HOME/los20"
          cd "$HOME/los20"

          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --git-lfs

      - name: Configurar local manifests
        run: |
          set -e

          mkdir -p "$HOME/los20/.repo/local_manifests"

          cp "$GITHUB_WORKSPACE/manifests/j2lte.xml" \
             "$HOME/los20/.repo/local_manifests/j2lte.xml"

          cp "$GITHUB_WORKSPACE/manifests/j2lte-slsi.xml" \
             "$HOME/los20/.repo/local_manifests/j2lte-slsi.xml"

          cp "$GITHUB_WORKSPACE/manifests/j2lte-slim.xml" \
             "$HOME/los20/.repo/local_manifests/j2lte-slim.xml"

      - name: repo sync
        working-directory: /home/runner/los20
        run: |
          set -e

          echo "=== DISCO PRE-SYNC ==="
          df -h /

          time repo sync \
            -c \
            --no-tags \
            --fail-fast \
            -j4

          echo "=== DISCO POST-SYNC ==="
          df -h /

          echo "=== .repo SIZE AFTER SYNC (medición temporal, no borra nada) ==="
          du -sh .repo 2>/dev/null || true
          echo "=== .repo COMPONENTS ==="
          du -sh .repo/* 2>/dev/null | sort -h || true
          echo "=== project-objects ==="
          du -sh .repo/project-objects 2>/dev/null || true
          echo "=== projects ==="
          du -sh .repo/projects 2>/dev/null || true
          echo "=== .repo/projects breakdown (temporal, solo lectura) ==="
          du -sh .repo/projects/* 2>/dev/null | sort -rh | head -30 || true
          echo "=== largest files in projects ==="
          find .repo/projects -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -30 || true
          echo "=== FREE SPACE ==="
          df -h /

      - name: Poda post-sync (prebuilts/rust/darwin-x86)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RUST DARWIN ANTES ==="
          df -h /
          du -sh prebuilts/rust/darwin-x86 2>/dev/null || true

          # Verificaciones de seguridad: debe existir como directorio
          if [ ! -d "prebuilts/rust/darwin-x86" ]; then
            echo "::error::Directorio esperado no existe: prebuilts/rust/darwin-x86 -> se aborta la poda"
            exit 1
          fi

          # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
          PARENT="$(cd prebuilts/rust/darwin-x86 && pwd)"
          EXPECTED="$(pwd)/prebuilts/rust/darwin-x86"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "::error::Resolución inesperada para prebuilts/rust/darwin-x86 ($PARENT != $EXPECTED) -> abort"
            exit 1
          fi

          # Verificar que la toolchain linux-x86 (única usada en runner Linux) SÍ existe
          if [ ! -d "prebuilts/rust/linux-x86" ]; then
            echo "::error::prebuilts/rust/linux-x86 no existe -> se aborta (se protege la toolchain activa)"
            exit 1
          fi

          rm -rf prebuilts/rust/darwin-x86

          echo "=== PODA RUST DARWIN DESPUÉS ==="
          df -h /
          ls -d prebuilts/rust/darwin-x86 2>/dev/null \
            && echo "::error::la poda no eliminó por completo" \
            || echo "OK: prebuilts/rust/darwin-x86 eliminado"

      - name: Poda post-sync (prebuilts/rust/linux-x86 1.57.0/1.58.0/1.58.1)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RUST VERSIONES NO ACTIVAS ANTES ==="
          df -h /
          VERSIONS="prebuilts/rust/linux-x86/1.57.0 prebuilts/rust/linux-x86/1.58.0 prebuilts/rust/linux-x86/1.58.1"
          du -sh $VERSIONS 2>/dev/null || true

          # Verificar que la toolchain activa (RustDefaultVersion = 1.59.0) SÍ existe
          if [ ! -d "prebuilts/rust/linux-x86/1.59.0" ]; then
            echo "::error::prebuilts/rust/linux-x86/1.59.0 no existe -> se aborta (se protege la toolchain activa)"
            exit 1
          fi

          for V in $VERSIONS; do
            # Verificaciones de seguridad: debe existir como directorio
            if [ ! -d "$V" ]; then
              echo "::error::Directorio esperado no existe: $V -> se aborta la poda"
              exit 1
            fi

            # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
            PARENT="$(cd "$V" && pwd)"
            EXPECTED="$(pwd)/$V"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $V ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$V"

            ls -d "$V" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $V" \
              || echo "OK: $V eliminado"
          done

          echo "=== PODA RUST VERSIONES NO ACTIVAS DESPUÉS ==="
          df -h /

      - name: Poda post-sync (prebuilts/module_sdk/art snapshot inactivo @3)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA MODULE_SDK ART/3 ANTES ==="
          df -h /
          TARGET=prebuilts/module_sdk/art/3
          du -sh "$TARGET" 2>/dev/null || true

          # Verificar que el snapshot activo (@1) del proyecto module_sdk/art SÍ existe
          if [ ! -d "prebuilts/module_sdk/art/1" ]; then
            echo "::error::prebuilts/module_sdk/art/1 no existe -> se aborta (se protege el snapshot activo @1)"
            exit 1
          fi

          # Verificaciones de seguridad: debe existir como directorio
          if [ ! -d "$TARGET" ]; then
            echo "::error::Directorio esperado no existe: $TARGET -> se aborta la poda"
            exit 1
          fi

          # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
          PARENT="$(cd "$TARGET" && pwd)"
          EXPECTED="$(pwd)/$TARGET"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "::error::Resolución inesperada para $TARGET ($PARENT != $EXPECTED) -> abort"
            exit 1
          fi

          rm -rf "$TARGET"

          echo "=== PODA MODULE_SDK ART/3 DESPUÉS ==="
          df -h /
          ls -d "$TARGET" 2>/dev/null \
            && echo "::error::la poda no eliminó por completo" \
            || echo "OK: $TARGET eliminado"

      - name: Poda post-sync (prebuilts/android-emulator + remoteexecution-client)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA ANDROID-EMULATOR + REMOTEEXECUTION ANTES ==="
          df -h /
          du -sh prebuilts/android-emulator prebuilts/remoteexecution-client 2>/dev/null || true

          # Tolerante: el manifest j2lte-slim.xml ya puede haberlos excluido del
          # repo sync via <remove-project>. Si no existen, se informa y se
          # continúa (no abortar). Si existen, se podan.
          MISSING=0
          for d in android-emulator remoteexecution-client; do
            if [ ! -d "prebuilts/$d" ]; then
              echo "skip: prebuilts/$d no existe (ya excluido por j2lte-slim.xml en repo sync) -> nada que podar"
              MISSING=1
              continue
            fi
            PARENT="$(cd prebuilts/$d && pwd)"
            EXPECTED="$(pwd)/prebuilts/$d"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada prebuilts/$d ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi
          done

          if [ "$MISSING" = "1" ]; then
            echo "OK: sin poda post-sync necesaria (usa j2lte-slim.xml) -> continue"
          else
            rm -rf prebuilts/android-emulator prebuilts/remoteexecution-client
          fi

          echo "=== PODA ANDROID-EMULATOR + REMOTEEXECUTION DESPUÉS ==="
          df -h /
          for d in android-emulator remoteexecution-client; do
            ls -d prebuilts/$d 2>/dev/null \
              && echo "::error::la poda no eliminó $d" \
              || echo "OK: prebuilts/$d eliminado"
          done

      - name: Poda post-sync (prebuilts/runtime/mainline)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RUNTIME/MAINLINE ANTES ==="
          df -h /

          # Tolerante: si no existe (posible exclusión vía manifest), se informa y continúa.
          if [ ! -d "prebuilts/runtime/mainline" ]; then
            echo "skip: prebuilts/runtime/mainline no existe -> nada que podar"
            exit 0
          fi

          # Verificar que resuelva exactamente dentro del árbol (no un enlace ambiguo)
          PARENT="$(cd prebuilts/runtime/mainline && pwd)"
          EXPECTED="$(pwd)/prebuilts/runtime/mainline"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "::error::Resolución inesperada para prebuilts/runtime/mainline ($PARENT != $EXPECTED) -> abort"
            exit 1
          fi

          rm -rf prebuilts/runtime/mainline

          echo "=== PODA RUNTIME/MAINLINE DESPUÉS ==="
          df -h /
          ls -d prebuilts/runtime/mainline 2>/dev/null \
            && echo "::error::la poda no eliminó por completo" \
            || echo "OK: prebuilts/runtime/mainline eliminado"

      - name: Poda post-sync (Ronda 2 6 candidatas test/docs/clang)
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA RONDA 2 ANTES ==="
          df -h /
          TARGETS="
            tools/dexter/testdata
            external/libabigail/tests
            prebuilts/clang/host/linux-x86/clang-stable
            prebuilts/clang/host/linux-x86/profiles
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA RONDA 2 DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (Tier 1: 9 candidatas SAFE)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA TIER 1 (9 SAFE) ANTES ==="
          df -h /
          TARGETS="
            external/jackson-databind/docs
            external/swiftshader/tests
            prebuilts/clang-tools/darwin-x86
            prebuilts/build-tools/linux_musl-x86
            external/tensorflow/tensorflow/compiler
            external/tensorflow/tensorflow/python
            external/tensorflow/tensorflow/lite/testing
            external/deqp/external/openglcts
            prebuilts/build-tools/darwin-x86
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA TIER 1 DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (autotest client+server)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA AUTOTEST ANTES ==="
          df -h /
          TARGETS="
            external/autotest/client
            external/autotest/server
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

            PARENT="$(cd "$T" && pwd)"
            EXPECTED="$(pwd)/$T"
            if [ "$PARENT" != "$EXPECTED" ]; then
              echo "::error::Resolución inesperada para $T ($PARENT != $EXPECTED) -> abort"
              exit 1
            fi

            rm -rf "$T"

            ls -d "$T" 2>/dev/null \
              && echo "::error::la poda no eliminó por completo $T" \
              || echo "OK: $T eliminado"
          done

          echo "=== PODA AUTOTEST DESPUÉS ==="
          df -h /

      - name: "Poda post-sync (sdk/32)"
        working-directory: /home/runner/los20
        run: |
          set -e
          echo "=== PODA SDK/32 ANTES ==="
          df -h /
          TARGETS="
            prebuilts/sdk/32
          "
          du -sh $TARGETS 2>/dev/null || true

          # Tolerante: si la ruta no existe se informa y se continúa (no abortar).
          # Protección: nunca eliminar un proyecto Git completo (contiene .git),
          # porque rompería repo manifest (patrón jdk/qemu documentado).
          # prebuilts/sdk/32 es subdir sin .git (el proyecto es prebuilts/sdk);
          # cero sdk_version:"32" productivos en el árbol.
          for T in $TARGETS; do
            if [ ! -d "$T" ]; then
              echo "skip: $T no existe -> nada que podar"
              continue
            fi

            if [ -e "$T/.git" ]; then
              echo "::error::$T contiene .git (proyecto Git completo, no subdir podable) -> se aborta"
              exit 1
            fi

