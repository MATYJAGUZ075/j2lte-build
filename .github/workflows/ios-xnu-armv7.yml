# iOS J2 Port - XNU 4570 ARMv7 Build
#
# Builds XNU 4570.71.2 (iOS 10.3) for Exynos 3475 (SM-J200M / j2lte)
# on macOS runner using Apple's iPhoneOS SDK.
#
# Clones XNU 4570.71.2 from apple-oss-distributions, applies J2 patches,
# builds kernel with MACHINE_CONFIG=J2 (ARMv7, 4KB pages, Cortex-A7).

name: "iOS J2 Port - XNU 4570 ARMv7 Build"

on:
  push:
    branches: [experiment/ios-port]
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build (remove cache)'
        type: boolean
        default: true
      kernel_text_base:
        description: 'EXPERIMENTAL: __TEXT base address in hex (ej. 0x80000000). Vacio = sin cambios (base actual)'
        type: string
        default: '0x80000000'

jobs:
  xnu-armv7-build:
    name: Build XNU 4570 ARMv7 J2
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout j2lte-build (experiment/ios-port branch)
        uses: actions/checkout@v4
        with:
          ref: experiment/ios-port
          fetch-depth: 0

      - name: Build experimental prototypes
        working-directory: ios-port/experimental
        run: |
          set -e
          cc -std=c11 -Wall -Wextra -Werror -c boot_args_builder.c apple_dt_serializer.c boot_args_validator.c
          cc -std=c11 -Wall -Wextra -Werror -c macho/macho_loader.c -I macho
          cc -std=c11 -Wall -Wextra -Werror -c macho/full/macho_full.c -I macho/full -I macho
          cc -std=c11 -Wall -Wextra -Werror -c memplan/memplan.c -I. -Imemplan
          cc -std=c11 -Wall -Wextra -Werror -c load_planner.c -I. -I macho -I macho/full -I memory
          cc -std=c11 -Wall -Wextra -Werror -I. -I macho -I macho/full -I memory -I shim \
            integration/integration_test.c boot_args_builder.c apple_dt_serializer.c boot_args_validator.c \
            macho/macho_loader.c macho/full/macho_full.c memory/memory_manager.c shim/shim.c load_planner.c drivers/drivers.c platform/platform.c memplan/memplan.c \
            -o integration_test
          ./integration_test

      - name: Checkout XNU 4570.71.2 source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: xnu-4570.71.2
          path: ios-port/xnu-4570.71.2-source

      - name: Apply J2 patches to XNU
        run: |
          cp ios-port/xnu-4570.71.2/pexpert/pexpert/arm/J2.h ios-port/xnu-4570.71.2-source/pexpert/pexpert/arm/
          cp ios-port/xnu-4570.71.2/pexpert/pexpert/arm/board_config.h ios-port/xnu-4570.71.2-source/pexpert/pexpert/arm/
          cp ios-port/xnu-4570.71.2/pexpert/arm/pe_j2.c ios-port/xnu-4570.71.2-source/pexpert/arm/pe_j2.c
          python3 ios-port/experimental/patch_pe_init_j2.py ios-port/xnu-4570.71.2-source/pexpert/arm/pe_init.c
          cp ios-port/xnu-4570.71.2/config/MASTER.arm ios-port/xnu-4570.71.2-source/config/
          cp ios-port/xnu-4570.71.2/makedefs/MakeInc.def ios-port/xnu-4570.71.2-source/makedefs/
          grep -rn "PE_init_platform" ios-port/xnu-4570.71.2-source/pexpert/ | head -40
          echo "--- PE_state ---"
          grep -rn "PE_state" ios-port/xnu-4570.71.2-source/pexpert/ | head -40
          echo "--- firehose refs ---"
          grep -rln "firehose" ios-port/xnu-4570.71.2-source/pexpert/ | head -40
          echo "=== PE_init_platform function ==="
          sed -n '270,360p' ios-port/xnu-4570.71.2-source/pexpert/arm/pe_init.c

      - name: Build XNU compat DT test
        working-directory: ios-port/experimental
        run: |
          set -e
          XNU=../xnu-4570.71.2-source
          cc -std=c11 -Wall -Wextra -Werror \
            -I. -Ixnu_compat -I"$XNU" -I"$XNU/pexpert" -I"$XNU/pexpert/pexpert" -I"$XNU/osfmk" \
            -include xnu_compat/shims.h \
            "$XNU/pexpert/gen/device_tree.c" \
            apple_dt_serializer.c \
            xnu_compat/xnu_dt_test.c \
            -o xnu_dt_test
          ./xnu_dt_test

      - name: Patch XNU files.arm (ccn_set.s does not exist in open source release)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          sed -i '' 's|osfmk/corecrypto/ccn/src/arm/ccn_set.s|osfmk/corecrypto/ccn/src/ccn_set.c|' osfmk/conf/files.arm
          grep -n "ccn_set" osfmk/conf/files.arm
          test -f osfmk/corecrypto/ccn/src/ccn_set.c

      - name: Patch pexpert/arm Makefile (export J2.h like S7002.h / T8002.h)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          python3 - << 'MKEOF'
          p = "pexpert/pexpert/arm/Makefile"
          s = open(p).read()
          if "J2.h" not in s:
              s = s.replace("\tS7002.h \\\n", "\tJ2.h \\\n\tS7002.h \\\n", 1)
          assert "J2.h" in s, "no se pudo agregar J2.h a DATAFILES"
          open(p, "w").write(s)
          MKEOF
          grep -n "J2.h\|S7002.h" pexpert/pexpert/arm/Makefile
          test -f pexpert/pexpert/arm/J2.h

      - name: Apply compatibility patches (modern clang/migcom, missing Apple-private pieces)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          python3 - << 'PATCHEOF'
          import urllib.request

          def patch(path, old, new, skip_if=None):
              s = open(path).read()
              if skip_if and skip_if in s:
                  print("ya aplicado:", path)
                  return
              assert old in s, "NO ENCONTRADO en %s: %r" % (path, old[:70])
              open(path, "w").write(s.replace(old, new, 1))
              print("OK:", path)

          # 1) Flags de arch de Apple (privados) que faltan: kern_sysctl.c e ipsec.h usan __ARM__
          patch("makedefs/MakeInc.def",
                "MACHINE_FLAGS_ARM_J2 = -DARM_BOARD_CONFIG_J2 -DARM_J2",
                "MACHINE_FLAGS_ARM_J2 = -DARM_BOARD_CONFIG_J2 -DARM_J2 -D__ARM__",
                skip_if="-D__ARM__")

          # 2) if_ipsec.c: ipsec_needs_netagent solo existe con IPSEC_NEXUS (que aqui es 0)
          patch("bsd/net/if_ipsec.c",
                "\treturn (pcb->ipsec_needs_netagent == true);",
                "#if IPSEC_NEXUS\n\treturn (pcb->ipsec_needs_netagent == true);\n#else\n\t(void)pcb;\n\treturn (FALSE);\n#endif",
                skip_if="(void)pcb;\n\treturn (FALSE);")

          # 3) vm_object.c: clang moderno rechaza asignar un struct con miembro const
          patch("osfmk/vm/vm_object.c",
                "\t*object = vm_object_template;",
                "\t__builtin_memcpy((void *)object, (const void *)&vm_object_template, sizeof(*object));",
                skip_if="__builtin_memcpy((void *)object")

          # 4) commpage.c: remote_time.h no se publico; solo se usa bajo __arm64__
          s = open("osfmk/arm/commpage/commpage.c").read()
          for inc in ("#include <kern/remote_time.h>\n", "#include <machine/machine_remote_time.h>\n"):
              s = s.replace(inc, "")
          open("osfmk/arm/commpage/commpage.c", "w").write(s)
          assert "remote_time.h" not in s
          print("OK: osfmk/arm/commpage/commpage.c")

          # 5) migcom nuevo emite mach_msg_destroy_from_kernel (no existe en XNU 4570)
          patch("osfmk/kern/ipc_mig.h",
                "#define mach_msg_rpc_from_kernel mach_msg_rpc_from_kernel_proper\n",
                "#define mach_msg_rpc_from_kernel mach_msg_rpc_from_kernel_proper\n\n"
                "/* J2 bring-up shim: emitted by newer migcom, absent in XNU 4570 */\n"
                "extern void mach_msg_destroy_from_kernel(mach_msg_header_t *msg);\n",
                skip_if="mach_msg_destroy_from_kernel")
          c = open("osfmk/kern/ipc_mig.c").read()
          if "mach_msg_destroy_from_kernel" not in c:
              c += ("\n/*\n * J2 bring-up shim. Newer migcom emits calls to this on error paths of\n"
                    " * kernel-side MIG client stubs. XNU 4570 has no such function. This stub\n"
                    " * intentionally does NOT release port rights / OOL memory in the message\n"
                    " * (leaks on those error paths only).\n */\n"
                    "void\nmach_msg_destroy_from_kernel(mach_msg_header_t *msg)\n{\n\t(void)msg;\n}\n")
              open("osfmk/kern/ipc_mig.c", "w").write(c)
          print("OK: osfmk/kern/ipc_mig.c")

          # 6) firehose: header privado de libdispatch (no esta en el SDK publico)
          url = "https://raw.githubusercontent.com/apple-oss-distributions/libdispatch/libdispatch-913.30.4/os/firehose_buffer_private.h"
          data = urllib.request.urlopen(url, timeout=60).read()
          assert b"__FIREHOSE_BUFFER_PRIVATE__" in data
          text = data.decode("utf-8")
          guard = "#define __FIREHOSE_BUFFER_PRIVATE__\n"
          assert guard in text
          text = text.replace(guard, guard + "\n#ifndef OS_FIREHOSE_SPI\n#define OS_FIREHOSE_SPI 1\n#endif\n", 1)
          data = text.encode("utf-8")
          open("libkern/os/firehose_buffer_private.h", "wb").write(data)
          print("OK: libkern/os/firehose_buffer_private.h (%d bytes)" % len(data))
          PATCHEOF

      - name: Patch missing ARM pieces (san configs, zlib asm, firehose export)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          echo "=== libkern/os/Makefile (antes del parche) ==="
          cat libkern/os/Makefile
          echo "=== libkern/conf ==="
          ls libkern/conf
          echo "=== san/conf ==="
          ls san/conf
          python3 - << 'ARMEOF'
          import glob, os

          # A) san/conf: XNU 4570 open source solo trae configs x86_64; ARM va vacio
          os.makedirs("san/conf", exist_ok=True)
          for f in ("san/conf/Makefile.arm", "san/conf/files.arm"):
              if not os.path.exists(f):
                  open(f, "w").close()
                  print("creado vacio:", f)
              else:
                  print("ya existe:", f)

          # B) zlib: ensamblador ARM de Apple que no esta en el release open source
          bad = ("zlib/arm/inffastS.s", "zlib/arm/adler32vec.s")
          removed = 0
          for path in sorted(glob.glob("libkern/conf/files*")):
              lines = open(path).read().split("\n")
              keep = [l for l in lines if not any(b in l for b in bad)]
              n = len(lines) - len(keep)
              if n:
                  open(path, "w").write("\n".join(keep))
                  print("quitadas %d lineas de %s" % (n, path))
                  removed += n
          assert removed > 0, "no encontre referencias a inffastS.s / adler32vec.s en libkern/conf/files*"

          # C) firehose_buffer_private.h: agregarlo a EXPORT_MI_LIST (se exporta a EXPORT_HDRS/libkern/os)
          p = "libkern/os/Makefile"
          s = open(p).read()
          if "firehose_buffer_private.h" in s:
              print("ya aplicado:", p)
          else:
              old = "${KERNELFILES} ${PRIVATE_KERNELFILES} log_private.h"
              assert old in s, "no encontre la linea de EXPORT_MI_LIST en libkern/os/Makefile"
              s = s.replace(old, old + " firehose_buffer_private.h", 1)
              open(p, "w").write(s)
              print("OK:", p)
          ARMEOF
          echo "=== libkern/os/Makefile (despues del parche) ==="
          cat libkern/os/Makefile
          echo "=== diagnostico zlib: referencias a las versiones asm ==="
          grep -n "adler32_vec\|inflate_fast\|__arm__\|_ARM_ARCH\|__ARM_NEON__" libkern/zlib/adler32.c libkern/zlib/inffast.c || true

      - name: Show Xcode/SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find ld
          xcrun --sdk iphoneos --find mig

      - name: Setup build directories
        run: |
          BUILD_DIR="${{ runner.temp }}/xnu-j2-build"
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/obj" "${BUILD_DIR}/dst" "${BUILD_DIR}/sym"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "OBJROOT=${BUILD_DIR}/obj" >> $GITHUB_ENV
          echo "DSTROOT=${BUILD_DIR}/dst" >> $GITHUB_ENV
          echo "SYMROOT=${BUILD_DIR}/sym" >> $GITHUB_ENV

      - name: Fix python shebangs in XNU
        run: |
          find ios-port/xnu-4570.71.2-source -name "*.py" -exec sed -i '' '1s|^#!/usr/bin/python$|#!/usr/bin/env python3|' {} \;

      - name: Replace makekdebugevents.py with Python 3 version
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          cat > bsd/kern/makekdebugevents.py << 'PYEOF'
          #!/usr/bin/env python3
          #
          # This script scans the trace.codes file, containing a mapping of event id to
          # event name for all events, and writes to stdout a C declaration for a table
          # named kd_events[] or these mappings.
          # Required to generate a header file used by DEVELOPMENT and DEBUG kernels.
          #
          import sys
          import re

          # we expect one arg specifying the path to the trace.codes file
          if len(sys.argv) < 2:
              sys.exit(1)
          trace_code_file = sys.argv[1]

          # regular expression pattern to match <hex_id> <string>
          id_name_pattern = re.compile(r'0x([0-9a-fA-F]+)\s+([^\s]*)')
          code_table = []

          # scan file to generate internal table
          with open(trace_code_file, 'rt') as codes:
              for line in codes:
                  m = id_name_pattern.match(line)
                  if m:
                      code_table += [(int(m.group(1), base=16), m.group(2))]

          # emit typedef:
          print("typedef struct {")
          print("        uint32_t   id;")
          print("        const char *name;")
          print("} kd_event_t;")
          # emit structure declaration and sorted initialization:
          print("kd_event_t kd_events[] = {")
          for mapping in sorted(code_table, key=lambda x: x[0]):
              print("        {0x%x, \"%s\"}," % mapping)
          print("};")
          PYEOF
          chmod +x bsd/kern/makekdebugevents.py
          python3 -W error -m py_compile bsd/kern/makekdebugevents.py
          echo "OK: makekdebugevents.py (Python 3) compila"

      - name: Skip lldbmacros (Python 2 only, not needed to link the kernel)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          echo "=== tools/lldbmacros/Makefile (original) ==="
          cat tools/lldbmacros/Makefile | head -60
          cat > tools/lldbmacros/Makefile << 'LLDBEOF'
          export MakeInc_cmd=${SRCROOT}/makedefs/MakeInc.cmd
          export MakeInc_def=${SRCROOT}/makedefs/MakeInc.def
          export MakeInc_rule=${SRCROOT}/makedefs/MakeInc.rule
          export MakeInc_dir=${SRCROOT}/makedefs/MakeInc.dir

          include $(MakeInc_cmd)
          include $(MakeInc_def)

          # J2 bring-up: lldbmacros son Python 2 y no hacen falta para enlazar el kernel
          include $(MakeInc_rule)
          include $(MakeInc_dir)
          LLDBEOF
          echo "OK: lldbmacros neutralizado"

      - name: Probe 32-bit ARM toolchain (armv7k / armv7)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          LD="$(xcrun --sdk iphoneos --find ld)"
          T="$(mktemp -d)"
          echo 'int f(int x) { return x + 1; }' > "$T/t.c"
          CHOSEN=""
          for arch in armv7k armv7; do
            echo "=== probando -arch ${arch}"
            if "$CC" -arch "$arch" -miphoneos-version-min=10.0 -isysroot "$SDK" -ffreestanding -c "$T/t.c" -o "$T/t_${arch}.o"; then
              echo "compile OK"
              xcrun lipo -info "$T/t_${arch}.o" || true
              if "$LD" -arch "$arch" -r "$T/t_${arch}.o" -o "$T/r_${arch}.o"; then
                echo "ld OK"
                if [ -z "$CHOSEN" ]; then CHOSEN="$arch"; fi
              else
                echo "ld FALLO para ${arch}"
              fi
            else
              echo "compile FALLO para ${arch}"
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::Este Xcode no puede compilar+enlazar armv7k ni armv7. Hace falta otra toolchain (ver mensajes de arriba)."
            exit 1
          fi
          echo "ARM_ARCH elegido: ${CHOSEN}"
          echo "ARM_ARCH=${CHOSEN}" >> "$GITHUB_ENV"

      - name: Verify boot_args layout against real boot.h (read-only, informational)
        continue-on-error: true
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          H="pexpert/pexpert/arm/boot.h"
          echo "=== Verificacion de boot_args contra ${H} del checkout xnu-4570.71.2 ==="
          if [ ! -f "$H" ]; then
            echo "::warning::boot_args NO VERIFICADO: no existe ${H} en este checkout."
            exit 0
          fi
          echo "--- struct tal como esta en el checkout ---"
          sed -n '/struct Boot_Video/,/} boot_args;/p' "$H"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          T="${RUNNER_TEMP}/bootargs_check"
          mkdir -p "$T"
          cat > "$T/layout.c" << 'LAYEOF'
          #include <stdint.h>
          #include <stddef.h>
          #include <pexpert/arm/boot.h>
          boot_args j2_boot_args_probe;
          LAYEOF
          cat > "$T/assert.c" << 'ASSEOF'
          #include <stdint.h>
          #include <stddef.h>
          #include <pexpert/arm/boot.h>
          #define CHK(f, o) _Static_assert(offsetof(boot_args, f) == (o), "offset de " #f)
          CHK(Revision, 0x00);
          CHK(Version, 0x02);
          CHK(virtBase, 0x04);
          CHK(physBase, 0x08);
          CHK(memSize, 0x0c);
          CHK(topOfKernelData, 0x10);
          CHK(Video, 0x14);
          CHK(machineType, 0x2c);
          CHK(deviceTreeP, 0x30);
          CHK(deviceTreeLength, 0x34);
          CHK(CommandLine, 0x38);
          CHK(bootFlags, 0x138);
          CHK(memSizeActual, 0x13c);
          _Static_assert(sizeof(boot_args) == 0x140, "sizeof(boot_args)");
          ASSEOF
          INC="-I pexpert -I osfmk -I libkern -I bsd -I ."
          BASEFLAGS="-arch ${ARM_ARCH} -miphoneos-version-min=10.0 -isysroot ${SDK} -ffreestanding"
          echo "--- layout segun clang (${ARM_ARCH}, informativo; requiere codegen, por eso -c) ---"
          if "$CC" $BASEFLAGS $INC -Xclang -fdump-record-layouts -c "$T/layout.c" -o "$T/layout.o" > "$T/layout.log" 2>&1; then
            if grep -q "struct boot_args" "$T/layout.log"; then
              sed -n '/struct boot_args/,/sizeof=/p' "$T/layout.log" | head -40
            else
              echo "(el volcado de layout salio vacio; no afecta la comprobacion de offsets de abajo)"
            fi
          else
            echo "(no pude generar el volcado de layout; no afecta la comprobacion de offsets de abajo)"
            head -30 "$T/layout.log"
          fi
          echo "--- comprobacion de offsets (static_assert) ---"
          if "$CC" $BASEFLAGS $INC -fsyntax-only "$T/assert.c" > "$T/assert.log" 2>&1; then
            echo "::notice::boot_args: los offsets esperados COINCIDEN con pexpert/pexpert/arm/boot.h de este checkout (verificado por compilacion, no por ejecucion)."
          else
            echo "::warning::boot_args NO CONFIRMADO: los offsets esperados NO coinciden o la comprobacion no compilo. Ver errores:"
            head -40 "$T/assert.log"
          fi

      - name: Probe ld -image_base on armv7k static (informational)
        continue-on-error: true
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          T="$(mktemp -d)"
          echo 'void f(void) {}' > "$T/p.c"
          for base in none 0x80000000 0x80001000; do
            echo "=== base: ${base} ==="
            EXTRA=""
            if [ "$base" != "none" ]; then EXTRA="-Wl,-image_base,${base}"; fi
            if "$CC" -arch "${ARM_ARCH}" -miphoneos-version-min=10.0 -isysroot "$SDK" \
                 -ffreestanding -nostdlib -Wl,-static -Wl,-pagezero_size,0x0 \
                 -Wl,-e,_f ${EXTRA} "$T/p.c" -o "$T/p_${base}" 2>&1; then
              echo "link OK"
              xcrun otool -l "$T/p_${base}" | awk '/segname __TEXT/{f=1} f&&/vmaddr/{print "  __TEXT " $0; exit}'
              xcrun nm "$T/p_${base}" | grep " _f$" || true
            else
              echo "link FALLO con base ${base}"
            fi
          done

      - name: Optional experiment - set kernel __TEXT base (no-op if kernel_text_base is empty)
        working-directory: ios-port/xnu-4570.71.2-source
        env:
          KBASE: '0x80100000'
        run: |
          set -e
          if [ -z "${KBASE}" ]; then
            echo "kernel_text_base vacio: no se cambia la base (comportamiento actual)."
            exit 0
          fi
          if ! [[ "${KBASE}" =~ ^0x[0-9a-fA-F]+$ ]]; then
            echo "::error::kernel_text_base invalido: ${KBASE} (se espera hex tipo 0x80000000)"
            exit 1
          fi
          python3 - << 'BASEEOF'
          import os, re
          p = "makedefs/MakeInc.def"
          s = open(p).read()
          base = os.environ["KBASE"]
          m = re.search(r"^LDFLAGS_KERNEL_GEN = \\\n", s, re.M)
          assert m, "no encontre 'LDFLAGS_KERNEL_GEN = \\' en MakeInc.def"
          flag = "\t-Wl,-image_base,%s \\\n" % base
          if flag not in s:
              s = s[:m.end()] + flag + s[m.end():]
          open(p, "w").write(s)
          print("MakeInc.def: agregado a LDFLAGS_KERNEL_GEN -> -Wl,-image_base,%s" % base)
          BASEEOF
          grep -n "image_base" makedefs/MakeInc.def

      - name: Build XNU 4570 ARMv7 J2
        id: build
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set +e
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          KLIB="${SDK_PATH}/usr/local/lib/kernel"
          STUB_DIR="${BUILD_DIR}/stublibs"
          mkdir -p "${STUB_DIR}"
          : > "${STUB_DIR}/symbols.txt"
          sudo mkdir -p "${KLIB}"

          run_make() {
            set -o pipefail
            make -k \
              TARGET_CONFIGS="RELEASE ARM J2" \
              ARCH_CONFIGS=ARM \
              MACHINE_CONFIGS=J2 \
              KERNEL_CONFIGS=RELEASE \
              PLATFORM=iPhoneOS \
              SDKROOT=iphoneos \
              SDKVERSION=10.0 \
              ARCH_FLAGS_ARM="-arch ${ARM_ARCH}" \
              BUILD_LTO=0 \
              BUILD_DSYM=0 \
              BUILD_WERROR=0 \
              CTFCONVERT=/usr/bin/true \
              CTFMERGE=/usr/bin/true \
              CTFINSERT=/usr/bin/true \
              EMBEDDED_DEVICE_MAP=/dev/null \
              OBJROOT="${OBJROOT}" \
              DSTROOT="${DSTROOT}" \
              SYMROOT="${SYMROOT}" \
              all 2>&1 | tee "$1"
          }

          # Genera/actualiza una libreria stub (bring-up: solo para que el kernel enlace).
          # SOLO se generan stubs para simbolos de la whitelist explicita de abajo.
          # Cualquier otro simbolo indefinido hace fallar el workflow e informa cual es.
          make_stub_lib() {
            lib="$1"
            python3 - "${STUB_DIR}" "$2" << 'STUBEOF' || return 2
          import re, sys
          stub_dir, log_path = sys.argv[1], sys.argv[2]
          log = open(log_path, errors="replace").read()
          new = set(re.findall(r'^\s+"(_[^"]+)", referenced from', log, re.M))
          path = stub_dir + "/symbols.txt"
          old = set(l.strip() for l in open(path) if l.strip())
          real = set("___" + n for n in ("udivmoddi4","udivdi3","umoddi3","divdi3","moddi3","floatundidf","floatdidf","floatundisf","floatdisf","fixunsdfdi","fixdfdi","fixunssfdi","fixsfdi"))
          allsyms = sorted((old | new) - real)

          # Whitelist explicita de simbolos autorizados -> tipo de cuerpo del stub.
          #   "null": devuelve NULL (movs r0,#0; bx lr). EXPERIMENTAL: contrato de
          #           "buffer no disponible" de firehose; no probado en ejecucion.
          #   "void": bx lr, sin tocar r0 (comportamiento previo).
          ALLOWED = {
              "___firehose_buffer_create": "null",
              "___firehose_buffer_tracepoint_reserve": "null",
              "___firehose_buffer_tracepoint_flush": "void",
              "___firehose_merge_updates": "void",
              "___llvm_profile_get_size_for_buffer_internal": "void",
              "___llvm_profile_write_buffer_internal": "void",
          }
          unknown = sorted(s for s in allsyms if s not in ALLOWED)
          if unknown:
              print("::error::Simbolos indefinidos NO autorizados en la whitelist de stubs (%d): %s" % (len(unknown), ", ".join(unknown)))
              print("Se rechaza generar stubs automaticos para ellos. Revisar si son faltantes reales.")
              sys.exit(3)

          open(path, "w").write("\n".join(allsyms) + "\n")
          out = ["/* J2 bring-up stub: NO funcional, solo satisface el linker */",
                 'void j2_stub_placeholder(void) {}']
          for sym in allsyms:
              body = "\\tmovs r0, #0\\n\\tbx lr\\n" if ALLOWED[sym] == "null" else "\\tbx lr\\n"
              # simbolo Mach-O completo, sin depender del prefijo automatico de clang
              out.append('__asm__(".text\\n.thumb\\n.align 2\\n.globl %s\\n.thumb_func\\n%s:\\n%s");' % (sym, sym, body))
          open(stub_dir + "/stub.c", "w").write("\n".join(out) + "\n")
          print("stub con %d simbolos (%d nuevos), todos en whitelist" % (len(allsyms), len(new - old)))
          STUBEOF
            "${CC}" -arch "${ARM_ARCH}" -miphoneos-version-min=10.0 -isysroot "${SDK_PATH}" \
              -ffreestanding -c "${STUB_DIR}/stub.c" -o "${STUB_DIR}/stub.o" || return 1
            rm -f "${STUB_DIR}/lib${lib}.a"
            xcrun ar rcs "${STUB_DIR}/lib${lib}.a" "${STUB_DIR}/stub.o" "${STUB_DIR}/builtins.o" || return 1
            xcrun ranlib "${STUB_DIR}/lib${lib}.a"
            echo "--- simbolos definidos en lib${lib}.a ---"
            xcrun nm -g "${STUB_DIR}/lib${lib}.a" 2>/dev/null | grep -i " [TtDS] " | head -50
            echo "--- desensamblado de los stubs firehose (verificacion de retorno NULL) ---"
            xcrun llvm-objdump -d --triple=thumbv7k-apple-ios10.0 "${STUB_DIR}/stub.o" 2>&1 | grep -A3 "firehose" | head -40 || true
            sudo cp "${STUB_DIR}/lib${lib}.a" "${KLIB}/lib${lib}.a"
            echo "instalada ${KLIB}/lib${lib}.a"
          }

          # Builtins de 64 bits para armv7k: Xcode no trae libclang_rt para armv7k (solo armv7),
          # y el kernel necesita __udivdi3, __umoddi3, __moddi3, __floatdidf, etc.
          cat > "${STUB_DIR}/builtins.c" << 'BIEOF'
          /* J2 bring-up: minimal 64-bit compiler-rt builtins for armv7k (no libclang_rt for armv7k in Xcode) */
          typedef unsigned long long u64;
          typedef long long s64;
          typedef unsigned int u32;

          static u64 j2_udivmod(u64 n, u64 d, u64 *rem)
          {
          	u64 q = 0, r = 0;
          	int i;
          	if (d == 0) { if (rem) *rem = n; return 0; }
          	for (i = 63; i >= 0; i--) {
          		r = (r << 1) | ((n >> i) & 1);
          		if (r >= d) { r -= d; q |= ((u64)1 << i); }
          	}
          	if (rem) *rem = r;
          	return q;
          }

          u64 __udivmoddi4(u64 n, u64 d, u64 *rem) { return j2_udivmod(n, d, rem); }
          u64 __udivdi3(u64 n, u64 d) { return j2_udivmod(n, d, 0); }
          u64 __umoddi3(u64 n, u64 d) { u64 r; j2_udivmod(n, d, &r); return r; }
          s64 __divdi3(s64 a, s64 b)
          {
          	int neg = (a < 0) ^ (b < 0);
          	u64 ua = a < 0 ? (u64)0 - (u64)a : (u64)a;
          	u64 ub = b < 0 ? (u64)0 - (u64)b : (u64)b;
          	u64 q = j2_udivmod(ua, ub, 0);
          	return neg ? (s64)((u64)0 - q) : (s64)q;
          }
          s64 __moddi3(s64 a, s64 b)
          {
          	u64 ua = a < 0 ? (u64)0 - (u64)a : (u64)a;
          	u64 ub = b < 0 ? (u64)0 - (u64)b : (u64)b;
          	u64 r;
          	j2_udivmod(ua, ub, &r);
          	return a < 0 ? (s64)((u64)0 - r) : (s64)r;
          }
          double __floatundidf(u64 a)
          {
          	return (double)(u32)(a >> 32) * 4294967296.0 + (double)(u32)a;
          }
          double __floatdidf(s64 a)
          {
          	if (a < 0) return -__floatundidf((u64)0 - (u64)a);
          	return __floatundidf((u64)a);
          }
          float __floatundisf(u64 a) { return (float)__floatundidf(a); }
          float __floatdisf(s64 a) { return (float)__floatdidf(a); }
          u64 __fixunsdfdi(double d)
          {
          	u32 hi, lo;
          	if (d <= 0.0) return 0;
          	if (d >= 18446744073709551616.0) return ~(u64)0;
          	hi = (u32)(d / 4294967296.0);
          	lo = (u32)(d - (double)hi * 4294967296.0);
          	return ((u64)hi << 32) | lo;
          }
          s64 __fixdfdi(double d)
          {
          	if (d < 0.0) return (s64)((u64)0 - __fixunsdfdi(-d));
          	return (s64)__fixunsdfdi(d);
          }
          u64 __fixunssfdi(float f) { return __fixunsdfdi((double)f); }
          s64 __fixsfdi(float f) { return __fixdfdi((double)f); }
          BIEOF
          "${CC}" -arch "${ARM_ARCH}" -miphoneos-version-min=10.0 -isysroot "${SDK_PATH}" \
            -O2 -ffreestanding -fno-builtin -c "${STUB_DIR}/builtins.c" -o "${STUB_DIR}/builtins.o"
          if [ $? -ne 0 ]; then echo "::error::no compilo builtins.c"; exit 1; fi
          echo "builtins.o OK"

          OK=0
          LS_FIX=0
          STUB_FAIL=0
          for attempt in 1 2 3 4 5; do
            echo "##### intento ${attempt} #####"
            LOG="${BUILD_DIR}/build_attempt_${attempt}.log"
            if run_make "${LOG}"; then OK=1; cp "${LOG}" "${BUILD_DIR}/build.log"; break; fi
            cp "${LOG}" "${BUILD_DIR}/build.log"

            if grep -aq "must link with libSystem" "${LOG}"; then
              LS_FIX=$((LS_FIX+1))
              echo "=== diagnostico de flags de link en MakeInc.def ==="
              grep -n "LDFLAGS_KERNEL\|-static\|-kernel\|pagezero\|-pie\|image_base" makedefs/MakeInc.def | head -60
              python3 - "${LS_FIX}" << 'LSEOF'
          import re, shutil, sys, os
          level = int(sys.argv[1])
          p = "makedefs/MakeInc.def"
          if not os.path.exists(p + ".orig"):
              shutil.copy(p, p + ".orig")
          s = open(p + ".orig").read()
          flags = ["-Wl,-static"] if level == 1 else ["-Wl,-static", "-Wl,-kernel"]
          m = re.search(r"^LDFLAGS_KERNEL_GEN = \\\n", s, re.M)
          if not m:
              print("no encontre 'LDFLAGS_KERNEL_GEN = \\' en MakeInc.def (ver el diagnostico de arriba)")
              sys.exit(1)
          ins = "".join("\t%s \\\n" % f for f in flags)
          open(p, "w").write(s[:m.end()] + ins + s[m.end():])
          print("MakeInc.def: agregado a LDFLAGS_KERNEL_GEN ->", flags)
          LSEOF
              [ $? -ne 0 ] && break
              [ "${LS_FIX}" -le 2 ] && continue
            fi

            MISSING="$(grep -aoE "library not found for -l(firehose_kernel|cc_kext)" "${LOG}" | sed 's/.*-l//' | sort -u)"
            UNDEF_N="$(grep -acE '^\s+"_[^"]+", referenced from' "${LOG}")"
            if [ -z "${MISSING}" ] && [ "${UNDEF_N}" = "0" ]; then
              echo "El fallo no es de librerias faltantes ni simbolos indefinidos; me detengo."
              break
            fi
            if [ "${UNDEF_N}" -gt 300 ]; then
              echo "Demasiados simbolos indefinidos (${UNDEF_N}); no genero stubs."
              break
            fi
            for lib in ${MISSING}; do
              make_stub_lib "${lib}" "${LOG}" || { STUB_FAIL=1; break; }
            done
            if [ "${STUB_FAIL}" = "1" ]; then break; fi
            if [ -z "${MISSING}" ]; then
              # solo simbolos indefinidos: actualizar firehose_kernel
              make_stub_lib firehose_kernel "${LOG}" || { STUB_FAIL=1; break; }
            fi
          done
          if [ "${OK}" = "1" ]; then exit 0; fi
          if [ "${STUB_FAIL}" = "1" ]; then
            echo "::error::Generacion de stubs rechazada o fallida (simbolo fuera de la whitelist, o error al compilar/instalar el stub). Ver mensajes de arriba."
            exit 1
          fi

          # Exito parcial: el kernel enlazo (mach.release.j2) y solo fallaron los symbolsets de KPI
          # (kextsymboltool de macOS no conoce -arch armv7k). No hacen falta para el kernel en si.
          KERNEL_BIN="${OBJROOT}/RELEASE_ARM_J2/mach.release.j2"
          if [ -f "${KERNEL_BIN}" ] && [ -f "${KERNEL_BIN}.unstripped" ]; then
            OTHER_FAILS="$(grep -aoE "\*\*\* \[[^]]+\] Error" "${BUILD_DIR}/build.log" | sort -u | grep -avE "symbolset|check_all_exports|config_all|\[all\]|bootstrap" || true)"
            if [ -z "${OTHER_FAILS}" ]; then
              echo "::warning::Kernel enlazado OK. Fallaron solo los symbolsets de KPI (kextsymboltool: unknown architecture armv7k)."
              ls -l "${KERNEL_BIN}" "${KERNEL_BIN}.unstripped"
              xcrun lipo -info "${KERNEL_BIN}" || true
              xcrun file "${KERNEL_BIN}" 2>/dev/null || file "${KERNEL_BIN}" || true
              xcrun size -m "${KERNEL_BIN}" 2>/dev/null | head -30 || true
              exit 0
            fi
            echo "Otros fallos ademas de los symbolsets:"; echo "${OTHER_FAILS}"
          fi
          exit 1

      - name: Mach-O dump of real kernel (experimental)
        if: always()
        continue-on-error: true
        working-directory: ios-port/experimental
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          BIN=$(find "${OBJROOT}" -type f -name 'mach.release.j2.unstripped' | head -1)
          if [ -z "$BIN" ]; then echo "no kernel artifact"; exit 0; fi
          "$CC" -arch "${ARM_ARCH}" -miphoneos-version-min=10.0 -isysroot "$SDK" -std=c11 -Wall -Wextra -Werror -I. -I macho macho_dump.c macho/macho_loader.c -o macho_dump
          ./macho_dump "$BIN" | tee "${BUILD_DIR}/macho_dump.txt"
          echo "=== macho_dump saved to ${BUILD_DIR}/macho_dump.txt ==="
          python3 gen_manifest.py "${BUILD_DIR}/macho_dump.txt" "$BIN" "${BUILD_DIR}/manifest.json"
          echo "=== manifest saved ==="
          python3 validate_manifest.py

      - name: Inspect linked kernel (read-only, informational)
        if: always()
        continue-on-error: true
        env:
          KBASE: '0x80100000'
        run: |
          BIN="${OBJROOT}/RELEASE_ARM_J2/mach.release.j2.unstripped"
          if [ ! -f "${BIN}" ]; then
            echo "No hay ${BIN}; nada que inspeccionar."
            exit 0
          fi
          echo "=== segmentos ==="
          xcrun otool -l "${BIN}" | grep -E "segname|vmaddr|vmsize|fileoff|filesize" | head -60
          echo "=== simbolos clave ==="
          xcrun nm -n "${BIN}" | grep -E " (__start|_arm_init|___firehose_buffer_create|___firehose_buffer_tracepoint_reserve)$" || true
          VM="$(xcrun otool -l "${BIN}" | awk '/segname __TEXT/{f=1} f&&/vmaddr/{print $2; exit}')"
          echo "__TEXT vmaddr real: ${VM}"
          echo "=== stubs firehose enlazados: desensamblado Thumb + bytes crudos ==="
          echo "(esperado: movs r0, #0 ; bx lr = bytes 00 20 70 47)"
          for s in ___firehose_buffer_create ___firehose_buffer_tracepoint_reserve; do
            xcrun llvm-objdump -d --triple=thumbv7k-apple-ios10.0 --disassemble-symbols="$s" "${BIN}" 2>&1 || true
            ADDR="$(xcrun nm -n "${BIN}" | awk -v s="$s" '$3==s{print $1; exit}')"
            if [ -n "${ADDR}" ]; then
              OFF=$(( 0x${ADDR} - VM ))
              echo "${s} @ 0x${ADDR} (file offset ${OFF}): $(od -A n -t x1 -j ${OFF} -N 8 "${BIN}")"
            fi
          done
          if [ -n "${KBASE}" ]; then
            if [ $(( VM )) -ne $(( KBASE )) ]; then
              echo "::warning::__TEXT vmaddr (${VM}) distinto de kernel_text_base pedido (${KBASE}): ld no respeto -image_base."
            else
              echo "__TEXT vmaddr coincide con kernel_text_base (${KBASE})."
            fi
          fi

      - name: Audit Mach-O
        if: always()
        run: |
          BIN=$(find "${OBJROOT}" -type f -name 'mach.release.j2.unstripped' | head -1)
          if [ -z "$BIN" ]; then
            echo "No kernel artifact found"
            exit 0
          fi
          echo "SHA256: $(shasum -a 256 "$BIN" | awk '{print $1}')"
          file "$BIN"
          xcrun otool -l "$BIN" | head -80
          xcrun nm -n "$BIN" | head -40

      - name: Check build result
        if: always()
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"

          echo "=== Kernel artifacts ==="
          find "${OBJROOT}" \( -name 'mach*' -o -name 'kernel*' \) 2>/dev/null | head -20 || true
          find "${SYMROOT}" \( -name 'mach*' -o -name 'kernel*' \) 2>/dev/null | head -20 || true

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "=== Errores de compilador ÚNICOS (conteo) ==="
            grep -aoE "(fatal )?error: .*" "${BUILD_DIR}/build.log" | sort | uniq -c | sort -rn | head -40 || true
            echo "=== Otros errores (make / linker / ensamblador) ==="
            grep -aE "No rule to make target|Undefined symbols|^ld: |ld: symbol|command not found|Assembler messages|\.s:[0-9]+:.*error" "${BUILD_DIR}/build.log" | sed -E 's/^[0-9T:.Z-]+ //' | sort | uniq -c | sort -rn | head -30 || true
            echo "=== Contexto de los fallos de symbolset ==="
            grep -a -B12 "symbolset\] Error" "${BUILD_DIR}/build.log" | grep -av "warning:" | head -80 || true
            echo "=== Archivo kernel enlazado? ==="
            find "${OBJROOT}" -maxdepth 2 -name 'mach.release*' 2>/dev/null | head || true
            echo "=== Archivos que fallaron (make) ==="
            grep -aoE "\*\*\* \[[^]]+\] Error" "${BUILD_DIR}/build.log" | sort -u | head -40 || true
            echo "=== Last 40 lines ==="
            tail -40 "${BUILD_DIR}/build.log" || true
            exit 1
          else
            echo "=== Build SUCCESS ==="
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-build-log
          path:            ${{ env.BUILD_DIR }}/build*.log
           ${{ env.BUILD_DIR }}/macho_dump.txt
           ${{ env.BUILD_DIR }}/manifest.json
          if-no-files-found: ignore

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-kernel
          path: |
            ${{ env.OBJROOT }}/**/mach*
            ${{ env.SYMROOT }}/**/mach*
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "## ⚠️ ENLAZADO (no probado): XNU 4570 ARMv7 J2 produjo mach.release.j2. Symbolsets de KPI omitidos." >> $GITHUB_STEP_SUMMARY
            echo "Solo compila y enlaza. No esta demostrado que cargue ni arranque (faltan shim/loader, device tree y drivers)." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ FAILED: Errores de enlace/compilation" >> $GITHUB_STEP_SUMMARY
            echo "Ver build.log en artifacts para detalles." >> $GITHUB_STEP_SUMMARY
          fi
