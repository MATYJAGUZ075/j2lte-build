# iOS J2 Port - XNU 4570 ARMv7 Build
#
# Builds XNU 4570.71.2 (iOS 10.3) for Exynos 3475 (SM-J200M / j2lte)
# on macOS runner using Apple's iPhoneOS SDK.
#
# Clones XNU 4570.71.2 from apple-oss-distributions, applies J2 patches,
# builds kernel with MACHINE_CONFIG=J2 (ARMv7, 4KB pages, Cortex-A7).

name: "iOS J2 Port - XNU 4570 ARMv7 Build"

on:
  push:
    branches: [experiment/ios-port]
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build (remove cache)'
        type: boolean
        default: true

jobs:
  xnu-armv7-build:
    name: Build XNU 4570 ARMv7 J2
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout j2lte-build (experiment/ios-port branch)
        uses: actions/checkout@v4
        with:
          ref: experiment/ios-port
          fetch-depth: 0

      - name: Checkout XNU 4570.71.2 source
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: xnu-4570.71.2
          path: ios-port/xnu-4570.71.2-source

      - name: Apply J2 patches to XNU
        run: |
          cp ios-port/xnu-4570.71.2/pexpert/pexpert/arm/J2.h ios-port/xnu-4570.71.2-source/pexpert/pexpert/arm/
          cp ios-port/xnu-4570.71.2/pexpert/pexpert/arm/board_config.h ios-port/xnu-4570.71.2-source/pexpert/pexpert/arm/
          cp ios-port/xnu-4570.71.2/config/MASTER.arm ios-port/xnu-4570.71.2-source/config/
          cp ios-port/xnu-4570.71.2/makedefs/MakeInc.def ios-port/xnu-4570.71.2-source/makedefs/
          cp ios-port/xnu-4570.71.2/makedefs/MakeInc.top ios-port/xnu-4570.71.2-source/makedefs/

      - name: Patch XNU files.arm (ccn_set.s does not exist in open source release)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          sed -i '' 's|osfmk/corecrypto/ccn/src/arm/ccn_set.s|osfmk/corecrypto/ccn/src/ccn_set.c|' osfmk/conf/files.arm
          grep -n "ccn_set" osfmk/conf/files.arm
          test -f osfmk/corecrypto/ccn/src/ccn_set.c

      - name: Patch pexpert/arm Makefile (export J2.h like S7002.h / T8002.h)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          python3 - << 'MKEOF'
          p = "pexpert/pexpert/arm/Makefile"
          s = open(p).read()
          if "J2.h" not in s:
              s = s.replace("\tS7002.h \\\n", "\tJ2.h \\\n\tS7002.h \\\n", 1)
          assert "J2.h" in s, "no se pudo agregar J2.h a DATAFILES"
          open(p, "w").write(s)
          MKEOF
          grep -n "J2.h\|S7002.h" pexpert/pexpert/arm/Makefile
          test -f pexpert/pexpert/arm/J2.h

      - name: Apply compatibility patches (modern clang/migcom, missing Apple-private pieces)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          python3 - << 'PATCHEOF'
          import urllib.request

          def patch(path, old, new, skip_if=None):
              s = open(path).read()
              if skip_if and skip_if in s:
                  print("ya aplicado:", path)
                  return
              assert old in s, "NO ENCONTRADO en %s: %r" % (path, old[:70])
              open(path, "w").write(s.replace(old, new, 1))
              print("OK:", path)

          # 1) Flags de arch de Apple (privados) que faltan: kern_sysctl.c e ipsec.h usan __ARM__
          patch("makedefs/MakeInc.def",
                "MACHINE_FLAGS_ARM_J2 = -DARM_BOARD_CONFIG_J2 -DARM_J2",
                "MACHINE_FLAGS_ARM_J2 = -DARM_BOARD_CONFIG_J2 -DARM_J2 -D__ARM__",
                skip_if="-D__ARM__")

          # 2) if_ipsec.c: ipsec_needs_netagent solo existe con IPSEC_NEXUS (que aqui es 0)
          patch("bsd/net/if_ipsec.c",
                "\treturn (pcb->ipsec_needs_netagent == true);",
                "#if IPSEC_NEXUS\n\treturn (pcb->ipsec_needs_netagent == true);\n#else\n\t(void)pcb;\n\treturn (FALSE);\n#endif",
                skip_if="(void)pcb;\n\treturn (FALSE);")

          # 3) vm_object.c: clang moderno rechaza asignar un struct con miembro const
          patch("osfmk/vm/vm_object.c",
                "\t*object = vm_object_template;",
                "\t__builtin_memcpy((void *)object, (const void *)&vm_object_template, sizeof(*object));",
                skip_if="__builtin_memcpy((void *)object")

          # 4) commpage.c: remote_time.h no se publico; solo se usa bajo __arm64__
          s = open("osfmk/arm/commpage/commpage.c").read()
          for inc in ("#include <kern/remote_time.h>\n", "#include <machine/machine_remote_time.h>\n"):
              s = s.replace(inc, "")
          open("osfmk/arm/commpage/commpage.c", "w").write(s)
          assert "remote_time.h" not in s
          print("OK: osfmk/arm/commpage/commpage.c")

          # 5) migcom nuevo emite mach_msg_destroy_from_kernel (no existe en XNU 4570)
          patch("osfmk/kern/ipc_mig.h",
                "#define mach_msg_rpc_from_kernel mach_msg_rpc_from_kernel_proper\n",
                "#define mach_msg_rpc_from_kernel mach_msg_rpc_from_kernel_proper\n\n"
                "/* J2 bring-up shim: emitted by newer migcom, absent in XNU 4570 */\n"
                "extern void mach_msg_destroy_from_kernel(mach_msg_header_t *msg);\n",
                skip_if="mach_msg_destroy_from_kernel")
          c = open("osfmk/kern/ipc_mig.c").read()
          if "mach_msg_destroy_from_kernel" not in c:
              c += ("\n/*\n * J2 bring-up shim. Newer migcom emits calls to this on error paths of\n"
                    " * kernel-side MIG client stubs. XNU 4570 has no such function. This stub\n"
                    " * intentionally does NOT release port rights / OOL memory in the message\n"
                    " * (leaks on those error paths only).\n */\n"
                    "void\nmach_msg_destroy_from_kernel(mach_msg_header_t *msg)\n{\n\t(void)msg;\n}\n")
              open("osfmk/kern/ipc_mig.c", "w").write(c)
          print("OK: osfmk/kern/ipc_mig.c")

          # 6) firehose: header privado de libdispatch (no esta en el SDK publico)
          url = "https://raw.githubusercontent.com/apple-oss-distributions/libdispatch/libdispatch-913.30.4/os/firehose_buffer_private.h"
          data = urllib.request.urlopen(url, timeout=60).read()
          assert b"__FIREHOSE_BUFFER_PRIVATE__" in data
          text = data.decode("utf-8")
          guard = "#define __FIREHOSE_BUFFER_PRIVATE__\n"
          assert guard in text
          text = text.replace(guard, guard + "\n#ifndef OS_FIREHOSE_SPI\n#define OS_FIREHOSE_SPI 1\n#endif\n", 1)
          data = text.encode("utf-8")
          open("libkern/os/firehose_buffer_private.h", "wb").write(data)
          print("OK: libkern/os/firehose_buffer_private.h (%d bytes)" % len(data))
          PATCHEOF

      - name: Patch missing ARM pieces (san configs, zlib asm, firehose export)
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          echo "=== libkern/os/Makefile (antes del parche) ==="
          cat libkern/os/Makefile
          echo "=== libkern/conf ==="
          ls libkern/conf
          echo "=== san/conf ==="
          ls san/conf
          python3 - << 'ARMEOF'
          import glob, os

          # A) san/conf: XNU 4570 open source solo trae configs x86_64; ARM va vacio
          os.makedirs("san/conf", exist_ok=True)
          for f in ("san/conf/Makefile.arm", "san/conf/files.arm"):
              if not os.path.exists(f):
                  open(f, "w").close()
                  print("creado vacio:", f)
              else:
                  print("ya existe:", f)

          # B) zlib: ensamblador ARM de Apple que no esta en el release open source
          bad = ("zlib/arm/inffastS.s", "zlib/arm/adler32vec.s")
          removed = 0
          for path in sorted(glob.glob("libkern/conf/files*")):
              lines = open(path).read().split("\n")
              keep = [l for l in lines if not any(b in l for b in bad)]
              n = len(lines) - len(keep)
              if n:
                  open(path, "w").write("\n".join(keep))
                  print("quitadas %d lineas de %s" % (n, path))
                  removed += n
          assert removed > 0, "no encontre referencias a inffastS.s / adler32vec.s en libkern/conf/files*"

          # C) firehose_buffer_private.h: agregarlo a EXPORT_MI_LIST (se exporta a EXPORT_HDRS/libkern/os)
          p = "libkern/os/Makefile"
          s = open(p).read()
          if "firehose_buffer_private.h" in s:
              print("ya aplicado:", p)
          else:
              old = "${KERNELFILES} ${PRIVATE_KERNELFILES} log_private.h"
              assert old in s, "no encontre la linea de EXPORT_MI_LIST en libkern/os/Makefile"
              s = s.replace(old, old + " firehose_buffer_private.h", 1)
              open(p, "w").write(s)
              print("OK:", p)
          ARMEOF
          echo "=== libkern/os/Makefile (despues del parche) ==="
          cat libkern/os/Makefile
          echo "=== diagnostico zlib: referencias a las versiones asm ==="
          grep -n "adler32_vec\|inflate_fast\|__arm__\|_ARM_ARCH\|__ARM_NEON__" libkern/zlib/adler32.c libkern/zlib/inffast.c || true

      - name: Show Xcode/SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find ld
          xcrun --sdk iphoneos --find mig

      - name: Setup build directories
        run: |
          BUILD_DIR="${{ runner.temp }}/xnu-j2-build"
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/obj" "${BUILD_DIR}/dst" "${BUILD_DIR}/sym"
          echo "BUILD_DIR=${BUILD_DIR}" >> $GITHUB_ENV
          echo "OBJROOT=${BUILD_DIR}/obj" >> $GITHUB_ENV
          echo "DSTROOT=${BUILD_DIR}/dst" >> $GITHUB_ENV
          echo "SYMROOT=${BUILD_DIR}/sym" >> $GITHUB_ENV

      - name: Fix python shebangs in XNU
        run: |
          find ios-port/xnu-4570.71.2-source -name "*.py" -exec sed -i '' '1s|^#!/usr/bin/python$|#!/usr/bin/env python3|' {} \;

      - name: Replace makekdebugevents.py with Python 3 version
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set -e
          cat > bsd/kern/makekdebugevents.py << 'PYEOF'
          #!/usr/bin/env python3
          #
          # This script scans the trace.codes file, containing a mapping of event id to
          # event name for all events, and writes to stdout a C declaration for a table
          # named kd_events[] or these mappings.
          # Required to generate a header file used by DEVELOPMENT and DEBUG kernels.
          #
          import sys
          import re

          # we expect one arg specifying the path to the trace.codes file
          if len(sys.argv) < 2:
              sys.exit(1)
          trace_code_file = sys.argv[1]

          # regular expression pattern to match <hex_id> <string>
          id_name_pattern = re.compile(r'0x([0-9a-fA-F]+)\s+([^\s]*)')
          code_table = []

          # scan file to generate internal table
          with open(trace_code_file, 'rt') as codes:
              for line in codes:
                  m = id_name_pattern.match(line)
                  if m:
                      code_table += [(int(m.group(1), base=16), m.group(2))]

          # emit typedef:
          print("typedef struct {")
          print("        uint32_t   id;")
          print("        const char *name;")
          print("} kd_event_t;")
          # emit structure declaration and sorted initialization:
          print("kd_event_t kd_events[] = {")
          for mapping in sorted(code_table, key=lambda x: x[0]):
              print("        {0x%x, \"%s\"}," % mapping)
          print("};")
          PYEOF
          chmod +x bsd/kern/makekdebugevents.py
          python3 -W error -m py_compile bsd/kern/makekdebugevents.py
          echo "OK: makekdebugevents.py (Python 3) compila"

      - name: Probe 32-bit ARM toolchain (armv7k / armv7)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          LD="$(xcrun --sdk iphoneos --find ld)"
          T="$(mktemp -d)"
          echo 'int f(int x) { return x + 1; }' > "$T/t.c"
          CHOSEN=""
          for arch in armv7k armv7; do
            echo "=== probando -arch ${arch}"
            if "$CC" -arch "$arch" -miphoneos-version-min=10.0 -isysroot "$SDK" -ffreestanding -c "$T/t.c" -o "$T/t_${arch}.o"; then
              echo "compile OK"
              xcrun lipo -info "$T/t_${arch}.o" || true
              if "$LD" -arch "$arch" -r "$T/t_${arch}.o" -o "$T/r_${arch}.o"; then
                echo "ld OK"
                if [ -z "$CHOSEN" ]; then CHOSEN="$arch"; fi
              else
                echo "ld FALLO para ${arch}"
              fi
            else
              echo "compile FALLO para ${arch}"
            fi
          done
          if [ -z "$CHOSEN" ]; then
            echo "::error::Este Xcode no puede compilar+enlazar armv7k ni armv7. Hace falta otra toolchain (ver mensajes de arriba)."
            exit 1
          fi
          echo "ARM_ARCH elegido: ${CHOSEN}"
          echo "ARM_ARCH=${CHOSEN}" >> "$GITHUB_ENV"

      - name: Build XNU 4570 ARMv7 J2
        id: build
        working-directory: ios-port/xnu-4570.71.2-source
        run: |
          set +e
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          KLIB="${SDK_PATH}/usr/local/lib/kernel"
          STUB_DIR="${BUILD_DIR}/stublibs"
          mkdir -p "${STUB_DIR}"
          : > "${STUB_DIR}/symbols.txt"
          sudo mkdir -p "${KLIB}"

          run_make() {
            set -o pipefail
            make -k \
              TARGET_CONFIGS="RELEASE ARM J2" \
              ARCH_CONFIGS=ARM \
              MACHINE_CONFIGS=J2 \
              KERNEL_CONFIGS=RELEASE \
              PLATFORM=iPhoneOS \
              SDKROOT=iphoneos \
              SDKVERSION=10.0 \
              ARCH_FLAGS_ARM="-arch ${ARM_ARCH}" \
              BUILD_LTO=0 \
              BUILD_DSYM=0 \
              BUILD_WERROR=0 \
              CTFCONVERT=/usr/bin/true \
              CTFMERGE=/usr/bin/true \
              CTFINSERT=/usr/bin/true \
              EMBEDDED_DEVICE_MAP=/dev/null \
              OBJROOT="${OBJROOT}" \
              DSTROOT="${DSTROOT}" \
              SYMROOT="${SYMROOT}" \
              all 2>&1 | tee "$1"
          }

          # Genera/actualiza una libreria stub (bring-up: solo para que el kernel enlace)
          make_stub_lib() {
            lib="$1"
            python3 - "${STUB_DIR}" "$2" << 'STUBEOF'
          import re, sys
          stub_dir, log_path = sys.argv[1], sys.argv[2]
          log = open(log_path, errors="replace").read()
          new = set(re.findall(r'^\s+"(_[^"]+)", referenced from', log, re.M))
          path = stub_dir + "/symbols.txt"
          old = set(l.strip() for l in open(path) if l.strip())
          allsyms = sorted(old | new)
          open(path, "w").write("\n".join(allsyms) + "\n")
          out = ["/* J2 bring-up stub: NO funcional, solo satisface el linker */",
                 'void j2_stub_placeholder(void) {}']
          for i, sym in enumerate(allsyms):
              out.append('void j2_stub_%d(void) __asm__("%s"); void j2_stub_%d(void) {}' % (i, sym[1:], i))
          open(stub_dir + "/stub.c", "w").write("\n".join(out) + "\n")
          print("stub con %d simbolos (%d nuevos)" % (len(allsyms), len(new - old)))
          STUBEOF
            "${CC}" -arch "${ARM_ARCH}" -miphoneos-version-min=10.0 -isysroot "${SDK_PATH}" \
              -ffreestanding -c "${STUB_DIR}/stub.c" -o "${STUB_DIR}/stub.o" || return 1
            rm -f "${STUB_DIR}/lib${lib}.a"
            xcrun ar rcs "${STUB_DIR}/lib${lib}.a" "${STUB_DIR}/stub.o" || return 1
            xcrun ranlib "${STUB_DIR}/lib${lib}.a"
            sudo cp "${STUB_DIR}/lib${lib}.a" "${KLIB}/lib${lib}.a"
            echo "instalada ${KLIB}/lib${lib}.a"
          }

          OK=0
          for attempt in 1 2 3 4 5; do
            echo "##### intento ${attempt} #####"
            LOG="${BUILD_DIR}/build_attempt_${attempt}.log"
            if run_make "${LOG}"; then OK=1; cp "${LOG}" "${BUILD_DIR}/build.log"; break; fi
            cp "${LOG}" "${BUILD_DIR}/build.log"

            MISSING="$(grep -aoE "library not found for -l(firehose_kernel|cc_kext)" "${LOG}" | sed 's/.*-l//' | sort -u)"
            UNDEF_N="$(grep -acE '^\s+"_[^"]+", referenced from' "${LOG}")"
            if [ -z "${MISSING}" ] && [ "${UNDEF_N}" = "0" ]; then
              echo "El fallo no es de librerias faltantes ni simbolos indefinidos; me detengo."
              break
            fi
            if [ "${UNDEF_N}" -gt 300 ]; then
              echo "Demasiados simbolos indefinidos (${UNDEF_N}); no genero stubs."
              break
            fi
            for lib in ${MISSING}; do make_stub_lib "${lib}" "${LOG}"; done
            if [ -z "${MISSING}" ]; then
              # solo simbolos indefinidos: actualizar firehose_kernel
              make_stub_lib firehose_kernel "${LOG}"
            fi
          done
          [ "${OK}" = "1" ]

      - name: Check build result
        if: always()
        run: |
          echo "Build outcome: ${{ steps.build.outcome }}"

          echo "=== Kernel artifacts ==="
          find "${OBJROOT}" \( -name 'mach*' -o -name 'kernel*' \) 2>/dev/null | head -20 || true
          find "${SYMROOT}" \( -name 'mach*' -o -name 'kernel*' \) 2>/dev/null | head -20 || true

          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "=== Errores de compilador ÚNICOS (conteo) ==="
            grep -aoE "(fatal )?error: .*" "${BUILD_DIR}/build.log" | sort | uniq -c | sort -rn | head -40 || true
            echo "=== Otros errores (make / linker / ensamblador) ==="
            grep -aE "No rule to make target|Undefined symbols|^ld: |ld: symbol|command not found|Assembler messages|\.s:[0-9]+:.*error" "${BUILD_DIR}/build.log" | sed -E 's/^[0-9T:.Z-]+ //' | sort | uniq -c | sort -rn | head -30 || true
            echo "=== Archivos que fallaron (make) ==="
            grep -aoE "\*\*\* \[[^]]+\] Error" "${BUILD_DIR}/build.log" | sort -u | head -40 || true
            echo "=== Last 40 lines ==="
            tail -40 "${BUILD_DIR}/build.log" || true
            exit 1
          else
            echo "=== Build SUCCESS ==="
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-build-log
          path: ${{ env.BUILD_DIR }}/build*.log
          if-no-files-found: ignore

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-j2-kernel
          path: |
            ${{ env.OBJROOT }}/**/mach*
            ${{ env.SYMROOT }}/**/mach*
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "## ✅ SUCCESS: XNU 4570 ARMv7 J2 enlazado correctamente" >> $GITHUB_STEP_SUMMARY
            echo "Kernel listo para siguiente fase (shim/loader + drivers)." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ FAILED: Errores de enlace/compilation" >> $GITHUB_STEP_SUMMARY
            echo "Ver build.log en artifacts para detalles." >> $GITHUB_STEP_SUMMARY
          fi
