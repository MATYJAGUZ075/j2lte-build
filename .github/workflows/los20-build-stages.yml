# los20-build-stages.yml
#
# LineageOS 20 - Samsung J2 / j2lte
#
# Estrategia de almacenamiento:
#   repo sync
#       ↓
#   limpieza SOLO de prebuilts grandes/regenerables
#       ↓
#   guard de systemimage
#       ↓
#   build
#
# IMPORTANTE:
# NO eliminar .repo/project-objects ni .repo/projects.
# Eso rompió repo manifest -r en runs anteriores.
#
# FIX-028:
# El kernel genera zImage-dtb con DTB incorporado.
# No se genera dt.img separado.
#
# FIX-029:
# Adaptación Clang del kernel 3.10 ya realizada.
#
# Objetivo:
# Recuperar espacio post-sync sin podar código fuente ni
# romper los metadatos Git de repo.

name: LOS20 build stages

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Target principal'
        required: true
        default: 'systemimage-guard'
        type: choice
        options:
          - systemimage-guard
          - bootimage
          - recoveryimage

      min_free_gb:
        description: 'GB libres mínimos para systemimage después del cleanup'
        required: false
        default: '40'

      extra_targets:
        description: 'Targets extra secuenciales (bootimage,recoveryimage)'
        required: false
        default: ''

      prune_repo:
        description: 'Liberar espacio eliminando solo prebuilts grandes/regenerables (NO toca .repo)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      prune_tests:
        description: 'Eliminar módulos/tests rotos conocidos'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      slim_manifest:
        description: 'Usar manifest reducido j2lte-slim.xml'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: los20-stages
  cancel-in-progress: false

jobs:
  stage-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      USE_CCACHE: true
      CCACHE_EXEC: /usr/bin/ccache
      STAGE: ${{ github.event.inputs.stage }}
      MIN_FREE_GB: ${{ github.event.inputs.min_free_gb }}
      EXTRA: ${{ github.event.inputs.extra_targets }}

    steps:

      # ============================================================
      # INFRA
      # ============================================================

      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Liberar espacio del runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Disco ANTES
        run: |
          set -e
          echo "=== DISCO ANTES ==="
          df -h /
          df -h /mnt || true

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Resolver CCACHE_DIR
        run: |
          set -e

          MNT_FREE_GB=$(
            df --output=avail -BG /mnt 2>/dev/null |
            tail -1 |
            tr -dc '0-9' || echo 0
          )

          if [ -d /mnt ] && [ "${MNT_FREE_GB:-0}" -ge 10 ]; then
            sudo mkdir -p /mnt/ccache-j2lte
            sudo chown -R "$(id -u):$(id -g)" /mnt/ccache-j2lte
            CCACHE_DIR=/mnt/ccache-j2lte
          else
            CCACHE_DIR=/home/runner/.ccache-j2lte
          fi

          mkdir -p "$CCACHE_DIR"

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

          echo "CCACHE_DIR=$CCACHE_DIR"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-j2lte-los20-${{ github.run_id }}
          restore-keys: |
            ccache-j2lte-los20-

      # ============================================================
      # DEPENDENCIAS
      # ============================================================

      - name: Instalar dependencias
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git-lfs \
            python3 \
            curl \
            ccache \
            libc++1

          mkdir -p "$HOME/bin"

          curl -s \
            https://storage.googleapis.com/git-repo-downloads/repo \
            > "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "j2lte-ci"
          git config --global user.email "j2lte-ci@users.noreply.github.com"

          git lfs install

          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libncurses.so.6 \
            /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true

          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libtinfo.so.6 \
            /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

          sudo ln -sf \
            /usr/lib/x86_64-linux-gnu/libc++.so.1 \
            /usr/lib/x86_64-linux-gnu/libc++.so || true

          ccache -M 8G
          ccache -o compiler_check=content
          ccache -o namespace=j2lte-los20

      # ============================================================
      # SOURCE
      # ============================================================

      - name: repo init
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          mkdir -p "$HOME/los20"
          cd "$HOME/los20"

          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --git-lfs

      - name: Configurar local manifests
        run: |
          set -e

          mkdir -p "$HOME/los20/.repo/local_manifests"

          cp "$GITHUB_WORKSPACE/manifests/j2lte.xml" \
             "$HOME/los20/.repo/local_manifests/j2lte.xml"

          cp "$GITHUB_WORKSPACE/manifests/j2lte-slsi.xml" \
             "$HOME/los20/.repo/local_manifests/j2lte-slsi.xml"

          if [ "${{ github.event.inputs.slim_manifest }}" = "true" ]; then
            cp "$GITHUB_WORKSPACE/manifests/j2lte-slim.xml" \
               "$HOME/los20/.repo/local_manifests/j2lte-slim.xml"
          fi

      # ============================================================
      # REPO SYNC
      # ============================================================

      - name: repo sync
        working-directory: /home/runner/los20
        run: |
          set -e

          echo "=== DISCO PRE-SYNC ==="
          df -h /

          time repo sync \
            -c \
            --no-tags \
            --fail-fast \
            -j4

          echo "=== DISCO POST-SYNC ==="
          df -h /

      # ============================================================
      # LIMPIEZA DE ALMACENAMIENTO
      #
      # IMPORTANTE:
      # NO tocar .repo/project-objects
      # NO tocar .repo/projects
      # NO crear git stubs
      # ============================================================

      - name: Limpieza post-sync de prebuilts grandes
        if: ${{ github.event.inputs.prune_repo == 'true' }}
        working-directory: /home/runner/los20
        run: |
          set -e

          echo "========================================"
          echo "LIMPIEZA POST-SYNC"
          echo "========================================"

          echo "=== ANTES ==="
          df -h /

          echo
          echo "=== TAMAÑOS ==="

          du -sm \
            prebuilts/remoteexecution-client \
            prebuilts/android-emulator \
            prebuilts/abi-dumps \
            2>/dev/null || true

          echo
          echo "=== ELIMINANDO SOLO PREBUILTS ==="

          rm -rf \
            prebuilts/remoteexecution-client \
            prebuilts/android-emulator \
            prebuilts/abi-dumps

          echo
          echo "=== DESPUÉS ==="
          df -h /

          echo
          echo "=== ESPACIO RECUPERADO ==="

      # ============================================================
      # TESTS
      #
      # DESACTIVADO POR DEFECTO.
      # Solo usar si vuelve a aparecer el problema conocido.
      # ============================================================

      - name: Poda de tests opcional
        if: ${{ github.event.inputs.prune_tests == 'true' }}
        working-directory: /home/runner/los20
        run: |
          set -e

          echo "=== ELIMINANDO TESTS CONOCIDOS ==="

          rm -rf \
            packages/modules/Connectivity/tests \
            packages/modules/Wifi/service/tests/mts \
            packages/modules/Permission/SafetyCenter/Config/tests \
            frameworks/base/services/tests/PackageManagerServiceTests/host/test-apps/OverlayTarget \
            packages/modules/IPsec/tests

      # ============================================================
      # DIAGNOSTICO POST-CLEANUP
      # ============================================================

      - name: Diagnóstico de disco post-cleanup
        working-directory: /home/runner/los20
        run: |
          set -e

          echo "========================================"
          echo "DIAGNÓSTICO POST-CLEANUP"
          echo "========================================"

          echo
          echo "=== ROOT ==="
          df -h /

          echo
          echo "=== /mnt ==="
          df -h /mnt || true

          echo
          echo "=== TOP DIRECTORIOS ==="
          du -sm ./* 2>/dev/null |
            sort -rn |
            head -20

          echo
          echo "=== OUT ==="
          du -sm out 2>/dev/null || true

          echo
          echo "=== .REPO ==="
          du -sh .repo 2>/dev/null || true

      # ============================================================
      # BUILD CONFIG
      # ============================================================

      - name: Configurar lunch
        working-directory: /home/runner/los20
        run: |
          set -e

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug

      - name: Resolver target
        working-directory: /home/runner/los20
        run: |
          set -e

          case "$STAGE" in
            systemimage-guard)
              TARGET=systemimage
              ;;
            bootimage)
              TARGET=bootimage
              ;;
            recoveryimage)
              TARGET=recoveryimage
              ;;
            *)
              echo "::error::Stage inválido: $STAGE"
              exit 64
              ;;
          esac

          echo "REQUESTED_STAGE=$STAGE"
          echo "RESOLVED_TARGET=$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      # ============================================================
      # SYSTEM IMAGE GUARD
      # ============================================================

      - name: Guard de espacio para systemimage
        if: ${{ github.event.inputs.stage == 'systemimage-guard' }}
        run: |
          set -e

          AVAIL_GB=$(
            df --output=avail -BG / |
            tail -1 |
            tr -dc '0-9'
          )

          MIN="${MIN_FREE_GB:-40}"

          echo "========================================"
          echo "SYSTEMIMAGE DISK GUARD"
          echo "========================================"

          echo "Espacio libre: ${AVAIL_GB}G"
          echo "Mínimo requerido: ${MIN}G"

          if [ "$AVAIL_GB" -lt "$MIN" ]; then
            echo "::error::No hay espacio suficiente para systemimage."
            echo "::error::Libres: ${AVAIL_GB}G / requeridos: ${MIN}G"
            exit 90
          fi

          echo "OK: espacio suficiente para iniciar systemimage."

      # ============================================================
      # BUILD
      # ============================================================

      - name: ccache stats antes
        if: always()
        run: |
          ccache -s || true

      - name: Build targets
        working-directory: /home/runner/los20
        run: |
          set -o pipefail

          source build/envsetup.sh
          lunch lineage_j2lte-userdebug >/dev/null

          ALL_TARGETS="$TARGET"

          if [ -n "$EXTRA" ]; then
            IFS=',' read -ra EXTRAS <<< "$EXTRA"

            for extra in "${EXTRAS[@]}"; do
              case "$extra" in
                bootimage|recoveryimage)
                  ;;
                *)
                  echo "::error::Target extra inválido: $extra"
                  exit 66
                  ;;
              esac
            done

            ALL_TARGETS="$ALL_TARGETS,$EXTRA"
          fi

          echo "SECUENCIA: $ALL_TARGETS"

          IFS=',' read -ra TARGETS <<< "$ALL_TARGETS"

          for target in "${TARGETS[@]}"; do

            echo "========================================"
            echo "BUILD: $target"
            echo "========================================"

            echo "=== DISCO ANTES DEL TARGET ==="
            df -h /

            time mka "$target" -j"$(nproc)" \
              2>&1 | tee /tmp/stage.log

            RC=${PIPESTATUS[0]}

            if [ "$RC" -ne 0 ]; then
              echo "STAGE_EXIT=$RC ($target)"
              echo "=== DISCO AL FALLAR ==="
              df -h /
              exit "$RC"
            fi

            echo "OK: $target"

            echo "=== DISCO DESPUÉS DEL TARGET ==="
            df -h /
          done

      # ============================================================
      # RESULTADOS
      # ============================================================

      - name: ccache stats después
        if: always()
        run: |
          ccache -s || true

      - name: Recopilar artefactos
        if: always()
        working-directory: /home/runner/los20
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          PRODUCT=out/target/product/j2lte

          cp "$PRODUCT/boot.img" \
             "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null

          cp "$PRODUCT/recovery.img" \
             "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null

          cp "$PRODUCT/system.img" \
             "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null

          cp /tmp/stage.log \
             "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null

          echo "=== DISCO FINAL ==="
          df -h /

          echo "=== OUT ==="
          du -sm out 2>/dev/null || true

      - name: Upload artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ github.event.inputs.stage }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
